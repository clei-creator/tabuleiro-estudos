<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2740">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tabuleiro de Estudos</title>
<script>try { const p = localStorage.getItem('tabuleiro10:tema') || 'auto'; document.documentElement.dataset.theme = p === 'dark' || (p === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch (e) { /* sem storage */ }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE4; --surface:#FFFDF8; --surface-2:#FBF5E6; --line:#E2D9C6; --line-2:#EAE2D0;
  --ink:#1B2433; --ink-soft:#6B6455; --ink-faint:#8A8270;
  --navy:#1B2740; --navy-2:#24324F; --navy-line:#3A4766; --navy-ink:#F4EFE4; --navy-soft:#AEB6C8;
  --gold:#C9A75A; --gold-deep:#8A6A1F; --gold-ink:#7A5C1E; --gold-soft:#E8D6A6;
  --wine:#9B2C36; --wine-deep:#6E1E26; --wine-bg:#FBF1F1; --wine-line:#E8C9C9;
  --ok:#2F6B4F; --mist:#5A6E8C;
  --road:#EFE5CC; --road-edge:#E2D4B4; --halo:#FFFDF8;
  --serif:"Cormorant Garamond", Georgia, serif; --sans:Inter, "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0E1424; --surface:#172036; --surface-2:#1C2640; --line:#2A3550; --line-2:#24304A;
  --ink:#E8ECF4; --ink-soft:#A9B3C4; --ink-faint:#8791A6;
  --navy:#0B1120; --navy-2:#18233B; --navy-line:#2E3B5A; --navy-soft:#9AA5BC;
  --gold-ink:#E3C77F; --gold-soft:#4A3D1A; --wine-bg:#3A1A20; --wine-line:#5E2A33;
  --road:#26304A; --road-edge:#1D2639; --halo:#172036;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);transition:background 1s;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.storm-1{--bg:#E6E2D9} html[data-theme="dark"] body.storm-1{--bg:#11161F}
body.storm-2{background:linear-gradient(180deg,#3B4252,#5A6272) fixed}
body.storm-3{background:linear-gradient(180deg,#1C2029,#353B48) fixed}
body.storm-2 .on-bg, body.storm-3 .on-bg{color:#EEF0F4}
#rain,#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
#confetti{z-index:80}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
#flash.on{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.8}15%{opacity:.1}25%{opacity:.5}100%{opacity:0}}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button,a.btn{font-family:var(--sans);font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;min-height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:filter .15s,transform .08s}
button:hover{filter:brightness(1.04)} button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);box-shadow:0 3px 0 #0E1526}
html[data-theme="dark"] button.primary{background:var(--gold);border-color:var(--gold);color:#1B2740;box-shadow:0 3px 0 var(--gold-deep)}
button.gold{background:var(--gold);border-color:var(--gold);color:#1B2740;box-shadow:0 3px 0 var(--gold-deep)}
button.danger{background:var(--wine);border-color:var(--wine);color:#fff}
button.ghost{background:transparent}
button.icon{width:44px;padding:0}
.hdr button,.hdr a.btn{background:transparent;border-color:var(--navy-line);color:var(--navy-ink)}

/* barra superior */
.hdr{position:sticky;top:0;z-index:30;background:var(--navy);color:var(--navy-ink);padding-top:env(safe-area-inset-top)}
.hdr-row{display:flex;align-items:center;gap:14px;height:62px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .t{font-family:var(--serif);font-size:25px;font-weight:600;white-space:nowrap}
.tabs{display:flex;background:var(--navy-2);border-radius:10px;padding:3px;margin-left:8px}
.tabs button{white-space:nowrap;min-height:38px;border:0;background:transparent;color:var(--navy-soft);font-weight:500;padding:0 14px;border-radius:8px}
.tabs button.on{background:var(--gold);color:#1B2740;font-weight:700}
.hstats{display:flex;align-items:center;gap:16px;font-size:13px;color:#D9DEE8;margin-left:auto;white-space:nowrap}
.hstats span{display:flex;align-items:center;gap:6px}
.hstats b{color:#fff}
.hstats .warnc{color:#F3A6AE}
.hstats .okc{color:#9FC9A8}
.hstats svg.i{width:16px;height:16px;color:var(--gold)}
.hact{display:flex;gap:8px;margin-left:auto}
.hstats + .hact{margin-left:0}
@media (max-width:1199px){ .brand .t{display:none} }
.strip{display:none}
@media (max-width:1439px){ .hstats{display:none} .strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px 12px} .strip::-webkit-scrollbar{display:none}
  .strip span{flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--navy-2);border-radius:8px;padding:7px 10px;font-size:12px;color:#D9DEE8}
  .strip b{color:#fff} .strip svg.i{width:14px;height:14px;color:var(--gold)} .strip .warnc{color:#F3A6AE} .strip .okc{color:#9FC9A8} }
@media (max-width:640px){ .hdr-row{padding:0 12px;gap:8px;height:58px} .brand .t{display:none} .tabs{margin-left:0} .tabs button{padding:0 10px;font-size:13px} #btnSync .lbl{display:none} }

/* layout */
.wrap{max-width:1440px;margin:0 auto;padding:22px 24px 120px;position:relative;z-index:2}
.grid{display:grid;grid-template-columns:290px minmax(0,1fr) 320px;gap:22px;align-items:start}
#colL,#colR{display:flex;flex-direction:column;gap:14px}
@media (min-width:1100px){ #colL,#colR{position:sticky;top:calc(var(--hdrH,62px) + 16px);max-height:calc(100vh - var(--hdrH,62px) - 32px);overflow-y:auto;scrollbar-width:thin;padding-bottom:4px} }
@media (max-width:1099px){ .grid{grid-template-columns:320px minmax(0,1fr);grid-template-areas:"r c" "l c"} #colR{grid-area:r} #colL{grid-area:l} #colC{grid-area:c} }
@media (max-width:760px){ .wrap{padding:12px 12px 140px} .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"r" "c" "l";gap:14px} }
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card.navy{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
html[data-theme="dark"] .card.navy{background:#0B1120;border-color:var(--line)}
.kicker{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600;color:var(--ink-soft)}
.card.navy .kicker{color:var(--gold)}
.serif{font-family:var(--serif)}
.big-num{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1}
.note{font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.card.navy .note{color:var(--navy-soft)}
.bar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--gold)}
.char{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.medal{width:132px;height:132px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--gold);cursor:pointer;border:0;padding:0}
.stats4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats4 > div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stats4 .big-num{font-size:24px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.4;border:1px solid var(--line);background:var(--surface)}
.alert svg.i{margin-top:1px}
.alert.bad{background:var(--wine-bg);border-color:var(--wine-line);color:var(--wine-deep)}
html[data-theme="dark"] .alert.bad{color:#F3B8BF}
.alert.dark{background:#1B2740;border-color:#1B2740;color:#F4EFE4}
.alert.mist svg.i{color:var(--mist)}
.mission{display:flex;gap:12px;align-items:center}
.mission .n{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;font-weight:700;flex-shrink:0}
.mission.done .n{background:var(--gold);color:#1B2740}
.mission .mb{flex-grow:1;min-width:0}
.mission .mt{font-size:14px;font-weight:600}
.mission .bar{height:4px;margin-top:7px;background:var(--navy-2)}
.mission .r{font-size:12px;color:var(--navy-soft);white-space:nowrap}
.focus-chip{display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 8px 8px 14px;color:#1B1206}
.focus-chip b{display:block;font-size:14px}
.focus-chip span{font-size:12px}
.cta-bar{display:none}
@media (max-width:760px){ .cta-bar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(0,0,0,0),var(--bg) 35%)} .cta-bar button{width:100%;min-height:52px} #ctaSide{display:none} }

/* trilha */
.trail-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 0 10px;overflow:hidden}
.trail-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 18px 6px}
.trail-head h2{margin:0;font-family:var(--serif);font-size:26px;font-weight:600}
#trail{display:block;width:100%;height:auto;overflow:visible}
#trail text,#map text{font-family:var(--sans)}
.nd{cursor:pointer}
.nd:hover circle.face{filter:brightness(1.08)}
.lbl1{font-family:var(--serif) !important;font-weight:700;fill:var(--ink)}
.lbl2{fill:var(--ink-soft);font-size:12px}
.cur-ring{animation:ring 1.6s ease-in-out infinite}
@keyframes ring{0%,100%{stroke-opacity:.9}50%{stroke-opacity:.25}}
.pend-ring{animation:pend 1.2s ease-in-out infinite}
@keyframes pend{0%,100%{stroke-opacity:.9}50%{stroke-opacity:.2}}
.bob{animation:bob 1.8s ease-in-out infinite}
html[data-theme="dark"] .fig{filter:drop-shadow(0 0 1.5px rgba(244,239,228,.85))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* mapa */
.dist{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;margin-bottom:16px}
.dist .card.navy{flex:2 1 420px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.dist .card{flex:1 1 300px}
.track{position:relative;height:10px;border-radius:5px;background:#2E3B5A;margin-top:6px}
.track i{display:block;height:100%;border-radius:5px;background:var(--gold)}
.track b{position:absolute;top:-7px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#F4EFE4;box-shadow:0 0 0 3px var(--gold)}
.pieces{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:10px}
.pieces span{height:10px;border-radius:3px;background:var(--line-2)}
.pieces span.on{background:#B08D3C}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--ink-soft);padding:12px 18px 4px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}

/* pílula de sessão */
#pill{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:999px;background:var(--navy);color:#F4EFE4;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 24px)}
#pill.on{display:flex}
#pill .t{font-weight:700;font-variant-numeric:tabular-nums}
#pill .l{font-size:12px;color:var(--navy-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pill button{min-height:38px;border-radius:999px}
@media (max-width:760px){ #pill{bottom:84px} }

/* leitor: o fichamento aparece exatamente como no arquivo */
#reader{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:#fff}
#reader.on{display:flex}
.rbar{flex-shrink:0;background:#1B2740;color:#F4EFE4;padding-top:env(safe-area-inset-top)}
.rrow{height:52px;display:flex;align-items:center;gap:8px;padding:0 8px 0 6px}
.rrow .x{width:44px;min-height:44px;padding:0;border:0;background:transparent;color:#F4EFE4}
.rtitle{flex-grow:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rchip{display:none;align-items:center;gap:8px;height:36px;padding:0 4px 0 12px;border-radius:999px;background:#24324F;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rchip.on{display:flex}
.rchip.paused{background:#3A2F18;box-shadow:inset 0 0 0 1px #C9A75A}
.rchip .dot{width:7px;height:7px;border-radius:50%;background:#9FC9A8}
.rchip.paused .dot{background:#C9A75A}
.rchip.over .t{color:#9FC9A8}
.rchip button{width:30px;min-height:30px;height:30px;padding:0;border-radius:50%;border:0;background:#C9A75A;color:#1B2740}
.rchip button svg.i{width:13px;height:13px}
#rDone{min-height:36px;height:36px;border:0;background:#C9A75A;color:#1B2740;display:none}
#rDone.on{display:inline-flex}
.scrollbar{position:relative;height:20px;background:#2E3B5A}
.scrollbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#B08D3C,#E3C77F);transition:width .12s linear}
.scrollbar.full i{background:linear-gradient(90deg,#2F6B4F,#9FC9A8)}
.scrolllbl{position:absolute;right:10px;top:0;height:20px;display:flex;align-items:center;font-size:12px;font-weight:700;color:#F4EFE4;font-variant-numeric:tabular-nums;pointer-events:none;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.scrollbar.full .scrolllbl{color:#0E2A1C;text-shadow:none}
#readerF{flex:1;border:0;width:100%;background:#fff}
@media (max-width:640px){ .rtitle{font-size:13px} #rDone .lbl{display:none} }

/* modais */
.modal{position:fixed;inset:0;z-index:50;background:rgba(11,17,32,.6);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--bg);color:var(--ink);border-radius:20px;max-width:620px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
.sheet .head{padding:18px 20px;background:var(--navy);color:var(--navy-ink);position:relative;border-radius:20px 20px 0 0}
.sheet .head .meta{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold);font-weight:600}
.sheet .head h2{margin:6px 40px 0 0;font-family:var(--serif);font-size:26px;line-height:1.15;font-weight:700}
.sheet .head .sub{font-size:13px;color:var(--navy-soft);margin-top:4px}
.sheet .x{position:absolute;right:12px;top:12px;width:40px;min-height:40px;padding:0;border:0;background:rgba(255,255,255,.12);color:#fff}
.sheet .body{padding:16px 20px 22px}
.sheet h3{font-family:var(--serif);font-size:21px;margin:16px 0 8px}
.sheet p{margin:8px 0;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.row > button{flex:1 1 auto}
.hist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.hist li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px}
.hist li .n{display:block;margin-top:4px;font-style:italic;color:var(--ink-soft);white-space:pre-wrap}
textarea,input[type=number],select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
label.f{font-weight:600;font-size:13.5px;display:block;margin:12px 0 4px}
.counter{font-size:12px;font-weight:600;text-align:right;color:var(--wine)}
.counter.okc{color:var(--ok)}
.timer{font-family:var(--serif);font-size:46px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0}
.timer.over{color:var(--ok)}
.journal .day{margin:14px 0 4px;font-family:var(--serif);font-size:19px;font-weight:700}
.journal .it{font-size:13.5px;padding:4px 0 4px 10px;border-left:3px solid var(--line)}
.journal .it.loss{border-color:var(--wine);color:var(--wine)}
.journal .it.gain{border-color:var(--ok)}
.journal .it.shield{border-color:var(--mist)}
.journal .it.info{border-color:var(--ink-faint);color:var(--ink-soft)}
.anchor{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin:8px 0}
.anchor h4{margin:0 0 4px;font-family:var(--serif);font-size:20px}
.anchor p{margin:4px 0;font-size:13.5px}
.disc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.disc.off{opacity:.85;background:var(--surface-2)}
.disc .top{display:flex;align-items:center;gap:10px}
.disc .sw{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.disc label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;min-height:44px;padding-top:8px;border-top:1px solid var(--line-2);font-size:13.5px}
.disc input{width:22px;height:22px;accent-color:#1B2740}
.pillopt{display:flex;flex-wrap:wrap;gap:8px}
.pillopt label{display:flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;cursor:pointer}
.pillopt input{accent-color:#1B2740}
.seal-wrap{display:flex;flex-direction:column;align-items:center;margin-top:-58px}
.sheet.celebrate{background:var(--bg);overflow:visible;margin-top:70px}
.sheet.celebrate .body{padding-top:0}
.rays{position:fixed;inset:0;z-index:49;pointer-events:none;background:radial-gradient(circle at 50% 38%,rgba(201,167,90,.5),rgba(11,17,32,0) 60%)}
.arrival{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:#F4EFE4;background:radial-gradient(circle at 50% 36%,#3A3218 0%,#1B2740 42%,#0B1120 100%)}
.arrival:before{content:"";position:absolute;left:50%;top:36%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(201,167,90,.22) 0deg 6deg,rgba(201,167,90,0) 6deg 18deg);animation:spin 30s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.arrival > *{position:relative}
.arrival h1{font-family:var(--serif);font-size:clamp(40px,8vw,64px);margin:0;line-height:1}
.toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:90;font-weight:600;font-size:15px;color:#F4EFE4;background:#1B2740;border:1px solid var(--gold);padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toast 2.4s ease forwards;max-width:calc(100vw - 24px);text-align:center}
.toast.bad{background:var(--wine);border-color:var(--wine)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
@media (max-width:640px){ .modal{padding:0;align-items:flex-end} .sheet{border-radius:20px 20px 0 0;max-height:92dvh} .sheet .head{border-radius:20px 20px 0 0} .sheet.celebrate{margin-top:0} }
</style>
</head>
<body class="storm-0">
<canvas id="rain"></canvas><div id="flash"></div>

<header class="hdr">
  <div class="hdr-row">
    <div class="brand"><svg class="i" style="width:26px;height:26px;color:var(--gold)" viewBox="0 0 24 24"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/></svg><span class="t">Tabuleiro de Estudos</span></div>

<script>
// ==ENGINE== (funções puras: varredura das pastas e replay do log de eventos)
const CONFIG = {
  studyMin: 15,          // minutos mínimos para vencer uma casa
  reviewMin: 5,          // minutos mínimos para uma revisão
  kindleChars: 100,      // caracteres mínimos do diário de bordo (estudo no Kindle)
  kindleReviewChars: 60, // idem para revisão no Kindle
  startPts: 30, skipCost: 15,
  xpStudy: 20, xpReview: 5, xpPerLevel: 100,
  ptsReview: 5, ptsReviewFaded: 10,
  idleXp: 15, debtXp: 10, weekBonus: 30,
  fadeStart: 7, fadeFull: 21, maxLevel: 4,
  wardrobe: 12, ptsArrival: 100,          // traje = 12 − casas que faltam; chegar ao fim rende +100
  // 5 Âncoras (notebook "Aprendizagem Acelerada - Neurociência do TDAH")
  recallMin: 3, recallChars: 60,          // Arranco da Gaveta: resgate na folha em branco
  hookChars: 20, ptsHook: 5,              // Velcro de Conceitos: gancho na vida real
  nevoaMin: 1, nevoaMax: 3, ptsNevoa: 10, // Respiro da Névoa: revisão ideal entre 1 e 3 dias depois
  ptsCombo: 10, ptsComboFocus: 5,         // Embaralhamento: 2+ disciplinas no dia (menos no modo foco)
  mirrorMin: 3, ptsMirror: 5,             // Espelho Cego: 3 min explicando em voz alta
  colors: ['#7A3E48', '#2F5D8A', '#B7791F', '#2F6B4F', '#6B4C7A', '#2E7D7D', '#9B4E2F'],
};
const RE = {
  disc: /^(\d+)\.\s*(.+?)\s*¦\s*(.+)$/,
  lesson: /^(\d{6})\s*-\s*A(\d+)\s*-/,
  fic: /^A(\d+)\s*¦\s*(\d{6})\s*¦\s*FIC\s*¦\s*(.+?)\.html?$/i,
  prod: /^01_Produ(c|ç)(a|ã)o$/i,
};
const D = {
  key(dt) { return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`; },
  parse(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); },
  add(k, n) { const t = D.parse(k); t.setDate(t.getDate() + n); return D.key(t); },
  diff(a, b) { return Math.round((D.parse(b) - D.parse(a)) / 864e5); },
  monday(k) { const t = D.parse(k); t.setDate(t.getDate() - (t.getDay() + 6) % 7); return D.key(t); },
  fromYYMMDD(s) {
    const y = 2000 + +s.slice(0, 2), m = +s.slice(2, 4), d = +s.slice(4, 6), t = new Date(y, m - 1, d);
    return t.getMonth() === m - 1 && t.getDate() === d ? D.key(t) : null;
  },
  br(k) { const [, m, d] = k.split('-'); return `${d}/${m}`; },
  wd(k) { return ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][D.parse(k).getDay()]; },
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const decodeEntities = s => s.replace(/&(amp|lt|gt|quot|#39|nbsp);/g, (_, e) => ({ amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'", nbsp: ' ' })[e]).replace(/\s+/g, ' ');

// files: [{rel:'Disc/Aula/01_Produção/arquivo.html', read:()=>Promise<string>}]; dirs: ['Disc/Subpasta', ...]
async function buildLessons(files, dirs) {
  const N = s => s.normalize('NFC');
  const report = { ignored: [], problems: [] };
  const byDir = new Map();
  for (const f of files) {
    const seg = N(f.rel).split('/');
    if (seg.length !== 4 || !RE.prod.test(seg[2])) continue;
    const k = seg[0] + '/' + seg[1];
    if (!byDir.has(k)) byDir.set(k, []);
    byDir.get(k).push({ name: seg[3], rel: seg.join('/'), read: f.read });
  }
  const lessons = [], seenTop = new Set(), seenId = new Set();
  for (const dRel of [...new Set(dirs.map(N))].sort()) {
    const seg = dRel.split('/');
    if (seg.length !== 2 || seg[0].startsWith('_') || seg[0].startsWith('.')) continue;
    const [top, sub] = seg;
    const dm = top.match(RE.disc);
    if (!dm) {
      if (!seenTop.has(top)) { seenTop.add(top); report.ignored.push({ path: top, reason: 'pasta fora do padrão "N. Disciplina ¦ Professor"' }); }
      continue;
    }
    if (/^AAMMDD/i.test(sub)) continue; // pasta-modelo
    if (!RE.lesson.test(sub)) { report.ignored.push({ path: dRel, reason: 'não é pasta de aula (ex.: "1ª Unidade") — ignorada com tudo dentro' }); continue; }
    const cands = (byDir.get(dRel) || []).filter(x => RE.fic.test(x.name)).sort((a, b) => a.name.localeCompare(b.name));
    if (!cands.length) { report.problems.push({ path: dRel, reason: 'sem "Ann ¦ AAMMDD ¦ FIC ¦ Sigla.html" direto em 01_Produção' }); continue; }
    const f = cands[0], fm = f.name.match(RE.fic), date = D.fromYYMMDD(fm[2]);
    if (!date) { report.problems.push({ path: f.rel, reason: 'data inválida no nome do arquivo' }); continue; }
    const num = +fm[1], sigla = fm[3].trim();
    const id = `${sigla}-${fm[2]}-A${String(num).padStart(2, '0')}`;
    if (seenId.has(id)) { report.problems.push({ path: f.rel, reason: `aula duplicada (${id})` }); continue; }
    seenId.add(id);
    let title = '';
    try { const tm = (await f.read()).match(/<title[^>]*>([\s\S]*?)<\/title>/i); if (tm) title = decodeEntities(tm[1]).trim(); } catch (e) { /* sem título */ }
    lessons.push({ id, sigla, num, date, discN: +dm[1], discName: dm[2].trim(), prof: dm[3].trim(), title: title || `Aula ${num}`, path: f.rel });
  }
  lessons.sort((a, b) => a.date.localeCompare(b.date) || a.discN - b.discN || a.num - b.num);
  return { lessons, report };
}

function lessonLabel(L, id) { return L ? `${L.sigla} A${String(L.num).padStart(2, '0')}` : id; }

// data: {startDay, events:[{uid,t,id,day,ts,...}]}
// t: study | review | skip | conclude (disc) | reopen (disc) | focus (disc|null)
function replay(data, lessons, today) {
  const C = CONFIG;
  const byId = Object.fromEntries(lessons.map(l => [l.id, l]));
  const T = {};
  const tile = id => T[id] || (T[id] = { status: 'locked', reviews: [], gems: [], history: [], level: 0, lastTouch: null, skipDay: null, studiedDay: null, src: null, everSkipped: false, hook: false, flag: false });
  const s = { studySec: 0, points: C.startPts, xp: 0, streak: 0, best: 0, idleRun: 0, shields: {}, weeks: {}, journal: {}, srcCount: { pc: 0, kindle: 0 },
    todayAdvanced: false, concluded: {}, focusByDay: {}, arrivals: [], dayStudies: {}, dayReviews: {} };
  const weekLessons = {};
  for (const l of lessons) (weekLessons[D.monday(l.date)] ||= []).push(l.id);
  const evs = data.events.filter(e => e.day <= today).sort((a, b) => a.day.localeCompare(b.day) || a.ts.localeCompare(b.ts));
  const start = data.startDay;
  const first = evs.length && evs[0].day < start ? evs[0].day : start;
  const note = (d, kind, text) => (s.journal[d] ||= []).push({ kind, text });
  const st = id => T[id]?.status || 'locked';
  const open = l => !s.concluded[l.discN] && st(l.id) !== 'done' && st(l.id) !== 'dispensed';
  const available = () => lessons.some(open);
  const remAt = d => lessons.filter(l => l.date <= d && open(l)).length; // casas que faltam até a última aula disponível
  const dispense = disc => lessons.forEach(l => { if (l.discN === disc) { const t = tile(l.id); if (t.status !== 'done') t.status = 'dispensed'; } });
  let i = 0;
  for (let d = first; d <= today; d = D.add(d, 1)) {
    let advanced = false;
    const dayDiscs = new Set(); // Embaralhamento: disciplinas trabalhadas no dia
    while (i < evs.length && evs[i].day === d) {
      const e = evs[i++];
      if (e.t === 'focus') { s.focusByDay[d] = e.disc || null; continue; }
      if (e.t === 'conclude' || e.t === 'reopen') {
        const before = remAt(d);
        if (e.t === 'conclude' && !s.concluded[e.disc]) { s.concluded[e.disc] = d; dispense(e.disc); note(d, 'info', `Disciplina concluída (prova feita): aulas restantes dispensadas`); }
        if (e.t === 'reopen' && s.concluded[e.disc]) { delete s.concluded[e.disc]; lessons.forEach(l => { if (l.discN === e.disc && T[l.id]?.status === 'dispensed') T[l.id].status = 'locked'; }); note(d, 'info', 'Disciplina reaberta: as aulas voltaram à trilha'); }
        if (before > 0 && remAt(d) === 0) { s.arrivals.push(d); s.points += C.ptsArrival; note(d, 'gain', `Pauta zerada: chegou à última aula disponível · +${C.ptsArrival} honorários`); }
        continue;
      }
      const t = tile(e.id), L = byId[e.id], lab = lessonLabel(L, e.id);
      if (e.t !== 'skip') s.studySec += e.sec || (e.min || 0) * 60;
      if (e.t === 'study') {
        if (t.status === 'done') continue;
        const before = remAt(d), wasPending = t.status === 'pending';
        Object.assign(t, { status: 'done', studiedDay: d, lastTouch: d, src: e.src, skipDay: null });
        t.history.push(e); s.xp += C.xpStudy; s.srcCount[e.src] = (s.srcCount[e.src] || 0) + 1; advanced = true;
        s.dayStudies[d] = (s.dayStudies[d] || 0) + 1;
        if (L) dayDiscs.add(L.discN);
        note(d, 'gain', `${lab} vencida${e.src === 'kindle' ? ' no Kindle' : ''}${e.sec ? ` em ${Math.round(e.sec / 60)} min` : e.min ? ` em ${e.min} min` : ''}${e.recall ? ' · resgate feito' : ''}${wasPending ? ' (pendência quitada)' : ''} · +${C.xpStudy} XP`);
        if ((e.hook || '').trim().length >= C.hookChars) { t.hook = true; s.points += C.ptsHook; note(d, 'gain', `Velcro: ${lab} amarrada à vida real · +${C.ptsHook} honorários`); }
        if (before > 0 && remAt(d) === 0) { s.arrivals.push(d); s.points += C.ptsArrival; note(d, 'gain', `Pauta zerada: chegou à última aula disponível · +${C.ptsArrival} honorários`); }
      } else if (e.t === 'review') {
        if (t.status !== 'done') continue;
        t.history.push(e); s.srcCount[e.src] = (s.srcCount[e.src] || 0) + 1;
        const age = D.diff(t.lastTouch, d), mirror = e.mode === 'espelho';
        if (!t.reviews.some(r => r.day === d)) {
          if (age < C.nevoaMin) note(d, 'info', `Revisão de ${lab} no mesmo dia: registrada, sem pontos — deixe a matéria entrar na névoa (${C.nevoaMin} a ${C.nevoaMax} dias)`);
          else if (mirror && e.mirror === 'falhou') { t.flag = true; note(d, 'info', `Espelho Cego em ${lab}: travou ou usou jargão — casa marcada para reforço`); }
          else {
            const nevoa = age <= C.nevoaMax, faded = age >= C.fadeStart;
            const p = (nevoa ? C.ptsNevoa : faded ? C.ptsReviewFaded : C.ptsReview) + (mirror ? C.ptsMirror : 0);
            s.points += p; s.xp += C.xpReview; t.level = Math.min(C.maxLevel, t.level + 1); t.gems.push(e);
            s.dayReviews[d] = (s.dayReviews[d] || 0) + 1;
            if (mirror) t.flag = false;
            if (L) dayDiscs.add(L.discN);
            note(d, 'gain', `${mirror ? 'Espelho limpo' : 'Revisão'} de ${lab}${e.src === 'kindle' ? ' no Kindle' : ''}${nevoa ? ' · resgate na névoa' : faded ? ' (resgatou do desbotamento)' : ''} · +${p} honorários +${C.xpReview} XP`);
          }
        }
        t.reviews.push(e); t.lastTouch = d;
        if (!available()) advanced = true;
      } else if (e.t === 'skip') {
        if (t.status !== 'locked' || s.points < C.skipCost) continue;
        s.points -= C.skipCost; Object.assign(t, { status: 'pending', skipDay: d, everSkipped: true }); t.history.push(e);
        note(d, 'loss', `Pulou ${lab} · −${C.skipCost} honorários`);
      }
    }
    if (dayDiscs.size >= 2) {
      const p = s.focusByDay[d] ? C.ptsComboFocus : C.ptsCombo;
      s.points += p; note(d, 'gain', `Embaralhamento: ${dayDiscs.size} disciplinas no mesmo dia${s.focusByDay[d] ? ' (modo foco)' : ''} · +${p} honorários`);
    }
    if (d === today) s.todayDiscs = dayDiscs.size;
    for (const [w, list] of Object.entries(weekLessons)) {
      if (s.weeks[w] || !list.every(id => ['done', 'dispensed'].includes(T[id]?.status)) || !list.some(id => T[id]?.status === 'done')) continue;
      const perfect = list.every(id => !T[id].everSkipped);
      s.points += C.weekBonus; s.weeks[w] = { day: d, perfect };
      note(d, 'gain', `Pauta da semana de ${D.br(w)} transitada em julgado${perfect ? ' — acórdão unânime' : ''} · +${C.weekBonus} honorários`);
    }
    if (d === today) { s.todayAdvanced = advanced; break; }
    if (d < start) { if (advanced) { s.streak++; s.best = Math.max(s.best, s.streak); } continue; }
    // fechamento do dia
    for (const l of lessons) {
      const t = T[l.id];
      if (t?.status === 'pending' && t.skipDay < d) { s.points -= C.skipCost; note(d, 'loss', `Pendência ${lessonLabel(l)} drenou −${C.skipCost} honorários`); }
    }
    if (advanced) { s.streak++; s.best = Math.max(s.best, s.streak); s.idleRun = 0; }
    else if (!s.shields[D.monday(d)]) { s.shields[D.monday(d)] = d; note(d, 'shield', 'Dia sem avanço — habeas corpus semanal concedido'); }
    else {
      if (s.streak) note(d, 'loss', `Sequência de ${s.streak} dia(s) perdida`);
      s.streak = 0; s.xp = Math.max(0, s.xp - C.idleXp); s.idleRun++;
      note(d, 'loss', `Dia sem avanço · −${C.idleXp} XP`);
    }
    if (s.points < 0) { s.xp = Math.max(0, s.xp - C.debtXp); note(d, 'loss', `Saldo negativo · −${C.debtXp} XP`); }
  }
  const tiles = lessons.map(l => {
    const t = T[l.id] || tile(l.id), off = !!s.concluded[l.discN];
    const age = t.status === 'done' ? D.diff(t.lastTouch, today) : null;
    const fade = t.status === 'done' && !off ? clamp((age - C.fadeStart) / (C.fadeFull - C.fadeStart), 0, 1) : 0;
    const nevoa = t.status === 'done' && !off && age >= C.nevoaMin && age <= C.nevoaMax;
    return { ...l, ...t, age, fade, nevoa, off, flag: t.flag && !off, week: D.monday(l.date) };
  });
  const pending = tiles.filter(t => t.status === 'pending').length;
  const remaining = tiles.filter(t => !t.off && (t.status === 'locked' || t.status === 'pending')).length;
  let score = Math.min(s.idleRun, 3) + pending + (s.points < 0 ? 2 : 0);
  if (s.todayAdvanced) score = Math.max(0, score - 1);
  return {
    ...s, tiles, pending, remaining,
    traje: Math.max(0, C.wardrobe - remaining),
    pawn: tiles.findIndex(t => t.status === 'locked'),
    focusToday: s.focusByDay[today] || null,
    streakNow: s.streak + (s.todayAdvanced ? 1 : 0),
    level: Math.floor(s.xp / C.xpPerLevel) + 1,
    shieldAvailable: !s.shields[D.monday(today)],
    storm: score === 0 ? 0 : score <= 1 ? 1 : score <= 3 ? 2 : 3,
    fading: tiles.filter(t => t.fade > 0).length,
    nevoaCount: tiles.filter(t => t.nevoa).length,
    flagged: tiles.filter(t => t.status === 'done' && t.flag).length,
    todayDiscs: s.todayDiscs || 0,
    todayStudies: s.dayStudies[today] || 0,
    todayReviews: s.dayReviews[today] || 0,
    conquered: Object.values(T).filter(t => t.status === 'done').length,
  };
}
// ==/ENGINE==

// ===================== interface =====================
const qs = new URLSearchParams(location.search);
const SIM = /^\d{4}-\d{2}-\d{2}$/.test(qs.get('hoje') || '') ? qs.get('hoje') : null;
const today = () => SIM || D.key(new Date());
const STORE_KEY = 'tabuleiro10:v1' + (SIM ? ':sim' : '');
const PROGRESS_FILE = '_tabuleiro_progresso.json';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const discColor = n => CONFIG.colors[(n - 1) % CONFIG.colors.length];
const shade = (hex, f) => '#' + hex.slice(1).match(/../g).map(h => Math.round(parseInt(h, 16) * f).toString(16).padStart(2, '0')).join('');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ícones de traço (sem emojis)
const ICONS = {
  scale: '<path d="M12 3v18M7 21h10M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/>',
  coin: '<circle cx="12" cy="12" r="8"/><path d="M12 8v8"/>',
  flame: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 1 1 2 2 3 2 0-2-1-4 0-6z"/>',
  shield: '<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
  mist: '<path d="M4 9h16M6 13h12M4 17h16"/>',
  wrench: '<path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3z"/>',
  play: '<path d="M8 5l11 7-11 7z" fill="currentColor"/>',
  pause: '<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>',
  cloud: '<path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/>',
  storm: '<path d="M7 16a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1A3.5 3.5 0 0 1 17 14"/><path d="M12 13l-2 4h3l-2 4"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
  moon: '<path d="M20 14a8 8 0 1 1-10-10 7 7 0 0 0 10 10z"/>',
  auto: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',

function ctaButton() {

  if (cur) return `<button class="gold" data-open="${esc(cur.id)}">${ic('play')}Começar ${esc(lessonLabel(cur))} · ${CONFIG.studyMin} min</button>`;
  const nv = S.tiles.find(t => t.nevoa);

}
function alerts() {
  const w = [];

  if (S.points < 0) w.push(['bad', 'alert', `<b>Dívida de ${-S.points} honorários.</b> Pulos bloqueados e −${CONFIG.debtXp} XP por dia até sair do vermelho.`]);
  if (S.idleRun > 0 && !S.todayAdvanced) w.push(['bad', 'storm', `<b>${S.idleRun} dia(s) seguido(s) sem avanço.</b> A tempestade cresce sobre a pauta.`]);
  if (S.nevoaCount) w.push(['mist', 'mist', `<b>${S.nevoaCount} casa(s) na névoa:</b> momento ideal do resgate (+${CONFIG.ptsNevoa} cada).`]);
  if (S.flagged) w.push(['mist', 'wrench', `<b>${S.flagged} casa(s) em reforço</b> pelo Espelho Cego.`]);
  if (S.fading) w.push(['', 'leaf', `<b>${S.fading} casa(s) desbotando:</b> revise para recuperar o brilho (+${CONFIG.ptsReviewFaded}).`]);
  return w.map(([c, i, t, extra]) => `<div class="alert ${c}">${ic(i)}<span style="flex-grow:1">${t}${extra || ''}</span></div>`).join('');
}

// ---------- trilha (aba Hoje) ----------
function nodeSVG(t, x, y, r, opts = {}) {
  const col = discColor(t.discN), dark = shade(col, .7);
  const cur = t === currentTile();
  const kind = t.off && t.status !== 'done' ? 'off' : t.status === 'done' ? 'done' : t.status === 'pending' ? 'pending' : cur ? 'cur' : 'locked';
  const label = opts.labels !== false;
  let g = '';
  if (kind === 'off') g = `<circle cx="${x}" cy="${y}" r="${r * .45}" fill="var(--line)"/>`;
  else if (kind === 'done') {
    const sat = 1 - .75 * t.fade;
    g = `<g style="filter:saturate(${sat.toFixed(2)})${t.nevoa ? ';opacity:.62' : ''}">
      <circle cx="${x}" cy="${y + 4}" r="${r}" fill="${dark}"/><circle class="face" cx="${x}" cy="${y}" r="${r}" fill="${col}"/>
      ${t.level ? `<circle cx="${x}" cy="${y}" r="${r + 4}" fill="none" stroke="var(--gold)" stroke-width="${t.level}" opacity=".9"/>` : ''}
      <path d="M${x - r * .38},${y} l${r * .26},${r * .26} l${r * .5},-${r * .55}" fill="none" stroke="#fff" stroke-width="${Math.max(2.4, r * .1)}" stroke-linecap="round" stroke-linejoin="round"/></g>`;
    const gems = Math.min(t.gems.length, 6);
    for (let k = 0; k < gems; k++) { const a = Math.PI * (0.25 + 0.5 * (k + .5) / 6); g += `<circle cx="${x - Math.cos(a) * (r + 9) * (k % 2 ? 1 : -1) * 0 + (k - (gems - 1) / 2) * 7}" cy="${y + r + 10}" r="2.6" fill="var(--gold)"/>`; }
    const badge = t.flag ? 'wrench' : t.fade > 0 ? 'leaf' : t.nevoa ? 'mist' : t.hook ? 'link' : '';
    if (badge && label) g += `<g transform="translate(${x + r * .62},${y - r * .95})"><circle r="10" fill="var(--surface)" stroke="var(--line)"/><svg x="-7" y="-7" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${badge === 'wrench' ? '#B5650F' : 'var(--mist)'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS[badge]}</svg></g>`;
  } else if (kind === 'pending') g = `<circle cx="${x}" cy="${y + 4}" r="${r}" fill="#6E1E26"/><circle class="face" cx="${x}" cy="${y}" r="${r}" fill="#9B2C36"/><circle class="pend-ring" cx="${x}" cy="${y}" r="${r + 5}" fill="none" stroke="#9B2C36" stroke-width="3"/><path d="M${x},${y - r * .4} v${r * .5} M${x},${y + r * .38} v.5" stroke="#fff" stroke-width="${Math.max(2.6, r * .12)}" stroke-linecap="round"/>`;
  else if (kind === 'cur') g = `<circle cx="${x}" cy="${y + 4}" r="${r}" fill="#0E1526"/><circle class="face" cx="${x}" cy="${y}" r="${r}" fill="#1B2740" stroke="var(--gold)" stroke-width="2"/><circle class="cur-ring" cx="${x}" cy="${y}" r="${r + 7}" fill="none" stroke="var(--gold)" stroke-width="3"/><path d="M${x - r * .25},${y - r * .35} l${r * .6},${r * .35} l-${r * .6},${r * .35}z" fill="var(--gold)"/>`;
  else g = `<circle class="face" cx="${x}" cy="${y}" r="${r}" fill="var(--surface)" stroke="${col}" stroke-width="3" stroke-dasharray="${r > 20 ? '5 4' : '0'}"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="${r > 20 ? 12 : 9}" font-weight="700" fill="${col}">${String(t.num).padStart(2, '0')}</text>`;
  return `<g class="nd" data-id="${esc(t.id)}"><title>${esc(lessonLabel(t))} · ${esc(t.title)}</title>${g}</g>`;
}
function stateText(t) {
  if (t.off && t.status !== 'done') return 'dispensada';
  if (t.status === 'done') return t.flag ? 'reforço pelo Espelho' : t.fade > 0 ? 'desbotando · revise' : t.nevoa ? 'na névoa · revise' : t.level ? `brilho ${t.level}` : 'vencida';
  if (t.status === 'pending') return `pendente · −${CONFIG.skipCost}/dia`;
  return t === currentTile() ? 'você está aqui' : 'à frente';
}
function porticoSVG(x, y, w, kind) {
  const fill = { open: 'var(--bg)', gold: '#E8C873', unanime: '#C9A75A' }[kind], line = { open: 'var(--line)', gold: '#8A6A1F', unanime: '#5E4512' }[kind];
  const s = w / 74;
  return `<g transform="translate(${x - w / 2},${y - 31 * s}) scale(${s})" stroke="${line}" stroke-width="2" stroke-linejoin="round" fill="${fill}">
    <path d="M4 18 L37 3 L70 18 Z"/><rect x="8" y="19" width="58" height="5"/><rect x="12" y="25" width="6" height="26"/><rect x="26" y="25" width="6" height="26"/><rect x="42" y="25" width="6" height="26"/><rect x="56" y="25" width="6" height="26"/><rect x="4" y="52" width="66" height="7" rx="1"/></g>`;
}
function trailItems(filter) {
  const tiles = S.tiles.filter(t => !filter || t.discN === filter);
  const weeks = [...new Set(tiles.map(t => t.week))].sort();
  const first = weeks[0] && D.monday(S.tiles[0].date);
  const items = [];
  for (const w of weeks) {
    tiles.filter(t => t.week === w).forEach(t => items.push({ type: 'tile', t }));
    const list = S.tiles.filter(t => t.week === w), done = list.filter(t => t.status === 'done').length, closed = S.weeks[w];
    items.push({ type: 'gate', week: w, n: D.diff(first, w) / 7 + 1, kind: closed ? (closed.perfect ? 'unanime' : 'gold') : 'open', done, total: list.filter(t => !t.off || t.status === 'done').length });
  }
  return items;
}
function renderTrail() {
  const svg = $('trail'), f = focusDisc();
  const W = Math.max(300, svg.parentElement.clientWidth);
  const items = trailItems(f);
  $('trailTitle').textContent = f ? `Trilha de ${discs().find(x => x.n === f)?.sigla || ''}` : 'Trilha da pauta';
  const rem = f ? S.tiles.filter(t => t.discN === f && !t.off && (t.status === 'locked' || t.status === 'pending')).length : S.remaining;
  $('trailSub').textContent = rem ? `faltam ${rem} até a última aula${f ? ' desta disciplina' : ''}` : 'pauta zerada';
  if (!items.length) { svg.setAttribute('viewBox', `0 0 ${W} 120`); svg.innerHTML = `<text x="${W / 2}" y="60" text-anchor="middle" fill="var(--ink-soft)" font-size="14">Nenhuma aula na trilha ainda.</text>`; return; }
  const A = Math.min(110, W * .22), pat = [0, .7, 1, .7, 0, -.7, -1, -.7];
  let y = 40, k = 0;
  const pts = [];
  for (const it of items) {
    const x = it.type === 'gate' ? W / 2 : W / 2 + A * pat[k++ % pat.length];
    pts.push({ ...it, x, y });
    y += it.type === 'gate' ? 118 : 96;
  }
  const H = y + 30;
  const lastIdx = pts.map(p => p.type === 'tile').lastIndexOf(true);
  const road = upto => { let d = `M${pts[0].x},${pts[0].y}`; for (let i = 1; i <= upto; i++) { const a = pts[i - 1], b = pts[i], dy = (b.y - a.y) / 2; d += ` C${a.x},${a.y + dy} ${b.x},${b.y - dy} ${b.x},${b.y}`; } return d; };
  const curT = currentTile();
  const curIdx = curT ? pts.findIndex(p => p.t === curT) : lastIdx;
  let out = `<path d="${road(pts.length - 1)}" fill="none" stroke="var(--road-edge)" stroke-width="30" stroke-linecap="round"/>
    <path d="${road(pts.length - 1)}" fill="none" stroke="var(--road)" stroke-width="22" stroke-linecap="round"/>
    ${curIdx > 0 ? `<path d="${road(curIdx)}" fill="none" stroke="var(--gold)" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>` : ''}`;
  for (const p of pts) {
    if (p.type === 'gate') {
      out += `<g class="nd gate" data-week="${p.week}">${porticoSVG(p.x - 70, p.y, 64, p.kind)}
        <text x="${p.x - 28}" y="${p.y - 6}" class="lbl1" font-size="19">Semana ${p.n}</text>
        <text x="${p.x - 28}" y="${p.y + 12}" font-size="12" font-weight="600" fill="${p.kind === 'open' ? 'var(--ink-faint)' : 'var(--gold-ink)'}">${p.kind === 'open' ? `em andamento · ${p.done} de ${p.total}` : p.kind === 'unanime' ? 'acórdão unânime · +30' : 'transitada em julgado · +30'}</text></g>`;
    } else {
      const r = p.t === curT ? 30 : 26, left = p.x > W / 2 + 1;
      out += nodeSVG(p.t, p.x, p.y, r);
      if (!(p.t.off && p.t.status !== 'done')) out += `<g class="nd" data-id="${esc(p.t.id)}"><text x="${left ? p.x - r - 12 : p.x + r + 12}" y="${p.y - 2}" text-anchor="${left ? 'end' : 'start'}" class="lbl1" font-size="18">${esc(lessonLabel(p.t))}</text>
        <text x="${left ? p.x - r - 12 : p.x + r + 12}" y="${p.y + 15}" text-anchor="${left ? 'end' : 'start'}" class="lbl2" fill="${p.t.status === 'pending' ? '#9B2C36' : 'var(--ink-soft)'}">${stateText(p.t)}</text></g>`;
    }
  }
  const last = pts[lastIdx];
  const fx = last.x > W / 2 + 1 ? last.x + 36 : last.x - 62;
  out += `<g transform="translate(${fx},${last.y - 44})"><path d="M5 2v40" stroke="var(--ink)" stroke-width="2.5"/><path d="M6 3h22l-6 7 6 7H6z" fill="var(--gold)"/></g>`;
  const cp = pts[curIdx];
  if (cp) out += `<g transform="translate(${cp.x + (cp.x > W / 2 + 1 ? 54 : -54)},${cp.y + 26})"><g class="bob"><g class="fig" transform="scale(.62)">${figureSVG(S.traje)}</g></g></g>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = out;
  if (!renderTrail.scrolled && cp) { renderTrail.scrolled = true; setTimeout(() => { const r = svg.getBoundingClientRect(); const yy = r.top + scrollY + cp.y * (r.height / H) - innerHeight / 2; if (yy > 200) scrollTo({ top: yy, behavior: 'smooth' }); }, 300); }
}

// ---------- mapa geral ----------
function renderMap() {
  const piece = k => `<span class="${k < S.traje ? 'on' : ''}"></span>`;
  const total = S.tiles.filter(t => !t.off || t.status === 'done').length, doneN = S.tiles.filter(t => t.status === 'done').length;
  const pct = total ? Math.round(doneN / total * 100) : 0;
  const lastAvail = S.tiles.length ? S.tiles[S.tiles.length - 1].date : today();
  $('mapTop').innerHTML = `
    <div class="card navy"><div><div class="kicker">Distância até a última aula disponível</div><div class="big-num" style="font-size:36px;margin-top:4px">${S.remaining ? `Faltam ${S.remaining} casa(s)` : 'Pauta zerada'}</div><div class="note">${S.pending ? `${S.pending} pendente(s) incluída(s) · ` : ''}disciplinas concluídas não contam</div></div>
      <div style="flex:1 1 220px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--navy-soft)"><span>Fórum</span><span>Última aula · ${D.br(lastAvail)}</span></div><div class="track"><i style="width:${pct}%"></i><b style="left:${pct}%"></b></div></div></div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="serif" style="font-size:24px;font-weight:700">Traje ${S.traje} de ${CONFIG.wardrobe}</span><span class="note">${RANKS[S.traje]}</span></div>
      <div class="pieces">${Array.from({ length: CONFIG.wardrobe }, (_, k) => piece(k)).join('')}</div>
      <div class="note" style="margin-top:8px">Cada casa vencida devolve uma peça. Cada aula nova afasta o fim e tira uma.</div></div>`;
  const svg = $('map');
  const W = Math.max(320, svg.parentElement.clientWidth);
  const items = [];
  const weeks = [...new Set(S.tiles.map(t => t.week))].sort();
  for (const w of weeks) { S.tiles.filter(t => t.week === w).forEach(t => items.push({ type: 'tile', t })); const c = S.weeks[w]; items.push({ type: 'gate', week: w, kind: c ? (c.perfect ? 'unanime' : 'gold') : 'open' }); }
  if (!items.length) { svg.setAttribute('viewBox', `0 0 ${W} 100`); svg.innerHTML = ''; return; }
  const cols = clamp(Math.floor((W - 40) / 96), 3, 10), dx = (W - 80) / (cols - 1), rowH = 120;
  const pts = items.map((it, i) => { const r = Math.floor(i / cols), c = i % cols; return { ...it, x: r % 2 ? W - 40 - c * dx : 40 + c * dx, y: 60 + r * rowH, r }; });
  const road = upto => { let d = `M${pts[0].x},${pts[0].y}`; for (let i = 1; i <= upto; i++) { const a = pts[i - 1], b = pts[i]; if (a.r === b.r) d += ` L${b.x},${b.y}`; else { const o = a.x > W / 2 ? 60 : -60; d += ` C${a.x + o},${a.y} ${b.x + o},${b.y} ${b.x},${b.y}`; } } return d; };
  const curT = currentTile(), curIdx = curT ? pts.findIndex(p => p.t === curT) : pts.length - 1;
  let out = `<path d="${road(pts.length - 1)}" fill="none" stroke="var(--road-edge)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${road(pts.length - 1)}" fill="none" stroke="var(--road)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    ${curIdx > 0 ? `<path d="${road(curIdx)}" fill="none" stroke="var(--gold)" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>` : ''}`;
  for (const p of pts) {
    if (p.type === 'gate') out += `<g class="nd gate" data-week="${p.week}">${porticoSVG(p.x, p.y + 4, 34, p.kind)}</g>`;
    else {
      out += nodeSVG(p.t, p.x, p.y, p.t === curT ? 19 : 16, { labels: false });
      if (!(p.t.off && p.t.status !== 'done')) out += `<text x="${p.x}" y="${p.y + 34}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink-soft)">${esc(lessonLabel(p.t))}</text>`;
    }
  }
  const lastTile = [...pts].reverse().find(p => p.type === 'tile');
  out += `<g transform="translate(${lastTile.x + 8},${lastTile.y - 52})"><path d="M5 2v34" stroke="var(--ink)" stroke-width="2"/><path d="M6 3h18l-5 6 5 6H6z" fill="var(--gold)"/></g>`;
  const cp = pts[curIdx];
  if (cp) out += `<g transform="translate(${cp.x},${cp.y - 22})"><g class="fig" transform="scale(.44)">${figureSVG(S.traje)}</g></g>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${60 + Math.ceil(pts.length / cols) * rowH}`);
  svg.innerHTML = out;
  $('mapLegend').innerHTML = discs().map(d => `<span><i style="background:${discColor(d.n)}"></i>${esc(d.sigla)}${S.concluded[d.n] ? ' (concluída)' : ''}</span>`).join('') +
    `<span><i style="background:#9B2C36"></i>pendente</span><span><i style="background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink-faint)"></i>à frente</span><span><i style="background:var(--line)"></i>dispensada</span>`;
}

// ---------- modais ----------
function openModal(html, cls = '') { $('modalCard').className = 'sheet ' + cls; $('modalCard').innerHTML = html; $('modal').classList.add('on'); }
function closeModal() { $('modal').classList.remove('on'); $('modalCard').innerHTML = ''; document.querySelector('.rays')?.remove(); }
const head = (meta, title, sub = '', bg = '') => `<div class="head" ${bg ? `style="background:${bg}"` : ''}><button class="x" data-act="close" aria-label="Fechar">${ic('x')}</button><div class="meta">${meta}</div><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
const fmtDay = d => `${D.wd(d)} ${D.br(d)}`;
const lessonUrl = l => l.path.split('/').map(encodeURIComponent).join('/');

function tileModal(id) {
  const t = S.tiles.find(x => x.id === id); if (!t) return;
  const sess = DATA.session, mySess = sess && sess.id === id;
  if (mySess && sess.stage === 'recall') return recallModal();
  if (mySess && sess.stage === 'mirror') return mirrorModal();
  const playable = isPlayable(t), globalCur = S.pawn >= 0 && S.tiles[S.pawn] === t;
  const C = CONFIG;
  let actions = '';
  if (mySess) actions = sessionBlock(t);
  else if (sess) actions = `<p class="note">Há uma sessão em andamento em outra casa. Termine-a ou cancele antes.</p><div class="row"><button data-act="openSession">Ir para a sessão</button></div>`;
  else if (t.off && t.status !== 'done') actions = `<p class="note">Disciplina concluída: esta aula foi dispensada e não conta mais para o fim da pauta.</p>`;
  else if (playable) {
    actions = `<h3>Estudar esta aula · mín. ${C.studyMin} min</h3>
      <div class="row"><button class="primary" data-act="start" data-kind="study" data-src="pc">${ic(isMobile() ? 'book' : 'screen')}Estudar nesta tela</button></div>
      <div class="row"><button data-act="start" data-kind="study" data-src="kindle">${ic('book')}Sessão Kindle ao vivo</button><button class="ghost" data-act="later" data-kind="study">Já estudei no Kindle</button></div>
      <p class="note">Nesta tela, o fichamento abre exatamente como o arquivo e o cronômetro pausa sozinho se você fechar a aula ou sair do app. No Kindle ao vivo, o tempo corre mesmo com a tela bloqueada. Ao fim, vem o Arranco da Gaveta: ${C.recallMin} min resgatando de memória.</p>`;
    if (globalCur && t.status === 'locked') actions += `<h3>Pular</h3><div class="row"><button class="danger" data-act="skip" ${S.points < C.skipCost ? 'disabled' : ''}>Pular · −${C.skipCost} agora e por dia</button></div>${S.points < C.skipCost ? '<p class="note">Honorários insuficientes. Revise aulas anteriores para ganhar.</p>' : ''}`;
  } else if (t.status === 'done') {
    const revToday = t.reviews.some(r => r.day === today());
    const value = revToday ? 'já revisada hoje' : t.age < C.nevoaMin ? 'hoje não pontua · espere a névoa'
      : t.nevoa ? `na névoa: +${C.ptsNevoa}` : t.age >= C.fadeStart ? `desbotando: +${C.ptsReviewFaded}` : `+${C.ptsReview}`;
    actions = `<h3>Revisar · ${value}</h3>
      <div class="row"><button class="primary" data-act="start" data-kind="review" data-src="pc">Revisar nesta tela · ${C.reviewMin} min</button><button class="gold" data-act="start" data-kind="review" data-src="pc" data-mode="espelho">Espelho Cego · ${C.mirrorMin} min · +${C.ptsMirror}</button></div>
      <div class="row"><button data-act="start" data-kind="review" data-src="kindle">${ic('book')}Revisão Kindle ao vivo</button><button class="ghost" data-act="later" data-kind="review">Já revisei no Kindle</button></div>
      <p class="note">Espelho Cego: sem olhar nada, explique a aula em voz alta, como para alguém de 12 anos, sem jargão.${t.flag ? ' <b>Esta casa está em reforço.</b>' : ''}${revToday ? ' Você já revisou esta casa hoje: novas revisões ficam no histórico, mas não pontuam.' : t.age < C.nevoaMin ? ` Revisar no mesmo dia não consolida: o resgate rende mais entre ${C.nevoaMin} e ${C.nevoaMax} dias depois.` : ''}</p>`;
  } else actions = `<p class="note">Esta casa ainda está à frente. Vença a casa atual${focusDisc() ? '' : ', use o foco do dia nesta disciplina'} ou pule a atual para chegar aqui. Pode ler o conteúdo, mas não conta.</p>`;
  const hist = t.history.slice().reverse().map(e => `<li><b>${e.t === 'study' ? 'Estudo' : e.t === 'review' ? (e.mode === 'espelho' ? `Espelho Cego ${e.mirror === 'falhou' ? '(travou)' : '(limpo)'}` : 'Revisão') : 'Pulo'}</b> · ${fmtDay(e.day)}${e.src ? ` · ${e.src === 'kindle' ? 'Kindle' : e.dev === 'mobile' ? 'celular/tablet' : 'PC'}` : ''}${e.sec ? ` · ${fmtDur(e.sec)}` : e.min ? ` · ${e.min} min` : ''}${e.note ? `<span class="n">“${esc(e.note)}”</span>` : ''}${e.recall ? `<span class="n">Resgate: “${esc(e.recall)}”</span>` : ''}${e.hook ? `<span class="n">Gancho: “${esc(e.hook)}”</span>` : ''}</li>`).join('');
  openModal(`${head(`${esc(t.discName)} · ${esc(t.prof)}`, `${esc(lessonLabel(t))} — ${esc(t.title)}`, `Aula de ${fmtDay(t.date)} · ${stateText(t)}`)}
    <div class="body">${actions}
      <div class="row"><button class="ghost" data-act="read">${ic('book')}Abrir fichamento</button></div>
      ${hist ? `<h3>Histórico da casa</h3><ul class="hist">${hist}</ul>` : ''}</div>`);
  $('modalCard').dataset.id = id;
}
function sessionBlock(t) {
  const s = DATA.session, need = s.need * 60e3, el = elapsed(s);
  return `<h3>${s.mode === 'espelho' ? 'Espelho Cego: explique em voz alta, sem olhar nada' : `${s.kind === 'study' ? 'Estudando' : 'Revisando'} ${s.src === 'kindle' ? 'no Kindle' : 'nesta tela'}`}</h3>
    <div class="timer ${el >= need ? 'over' : ''}" id="mTimer">${sessionClock(s)}</div>
    <div class="note" style="text-align:center" id="mTimerSub">${s.runStart ? (el >= need ? 'Mínimo cumprido: o relógio conta todo o tempo' : 'Contagem do tempo mínimo') : 'Pausado'}</div>
    <div class="row"><button class="primary" id="mDone" data-act="finish" ${el < need ? 'disabled' : ''}>${s.kind === 'study' ? 'Estudei' : 'Revisei'}</button>
    <button data-act="togglePause">${s.runStart ? 'Pausar' : 'Retomar'}</button>
    ${s.src === 'pc' && s.mode !== 'espelho' ? '<button data-act="read">Reabrir aula</button>' : ''}
    <button class="ghost" data-act="cancel">Cancelar</button></div>`;
}
const clock = sec => { const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, x = sec % 60, p = n => String(n).padStart(2, '0'); return h ? `${h}:${p(m)}:${p(x)}` : `${p(m)}:${p(x)}`; };
// tempo da sessão: acumulado + trecho em andamento (pausas não contam)
const elapsed = s => (s.acc || 0) + (s.runStart ? Date.now() - s.runStart : 0);
// regressivo até o mínimo; depois conta para cima a partir dele (15:01, 15:02...)
const sessionClock = s => { const el = elapsed(s), need = s.need * 60e3; return el < need ? clock(Math.ceil((need - el) / 1000)) : clock(Math.floor(el / 1000)); };
const fmtDur = sec => sec >= 3600 ? `${Math.floor(sec / 3600)}h${String(Math.floor(sec / 60) % 60).padStart(2, '0')}` : `${Math.floor(sec / 60)} min ${String(sec % 60).padStart(2, '0')} s`;
function laterModal(id, kind) {
  const t = S.tiles.find(x => x.id === id);
  const min = kind === 'study' ? CONFIG.studyMin : CONFIG.reviewMin, chars = kind === 'study' ? CONFIG.kindleChars : CONFIG.kindleReviewChars;
  const y = D.add(today(), -1);
  openModal(`${head('Registro do Kindle', `${esc(lessonLabel(t))} — ${esc(t.title)}`)}
    <div class="body">
      <p>O Kindle não conversa com o PC, então a prova de estudo aqui é o seu <b>diário de bordo</b>: escreva com suas palavras as ideias-chave da aula.</p>
      <label class="f">Quando?</label><select id="kDay"><option value="${today()}">Hoje (${fmtDay(today())})</option><option value="${y}">Ontem (${fmtDay(y)})</option></select>
      <label class="f">Minutos estudados (mín. ${min})</label><input type="number" id="kMin" min="${min}" value="${min}">
      <label class="f">Diário de bordo — ${kind === 'study' ? '2 ou 3 ideias-chave' : 'o que você relembrou'} (mín. ${chars} caracteres)</label>
      <textarea id="kNote" placeholder="Ex.: A cadeia de custódia garante... O STJ entende que..."></textarea>
      <div class="counter" id="kCount">0/${chars}</div>
      ${kind === 'study' ? `<label class="f">Velcro — onde na sua vida ou trabalho você já viu isso? (opcional, +${CONFIG.ptsHook})</label><textarea id="kHook" style="min-height:70px" placeholder="Ex.: lembra o caso do cliente que…"></textarea>` : ''}
      <div class="row"><button class="primary" id="kSave" data-act="saveLater" data-kind="${kind}" disabled>Registrar ${kind === 'study' ? 'estudo' : 'revisão'}</button>
      <button class="ghost" data-act="back">Voltar</button></div></div>`);
  $('modalCard').dataset.id = id;
  const upd = () => { const n = $('kNote').value.trim().length, ok = n >= chars && +$('kMin').value >= min; $('kCount').textContent = `${n}/${chars}`; $('kCount').className = 'counter ' + (n >= chars ? 'okc' : ''); $('kSave').disabled = !ok; };
  $('kNote').addEventListener('input', upd); $('kMin').addEventListener('input', upd);
}
function skipModal(id) {
  const t = S.tiles.find(x => x.id === id);
  openModal(`${head('Tem certeza?', `Pular ${esc(lessonLabel(t))}?`, '', '#6E1E26')}
    <div class="body">
    <p>Pular custa <b>${CONFIG.skipCost} honorários agora</b>. A casa fica <b>pendente</b> e drena <b>mais ${CONFIG.skipCost} a cada dia</b> até você estudá-la. E ela continua contando como casa que falta, então o traje não volta.</p>
    <p>Se o saldo ficar negativo, você entra em dívida: pulos bloqueados, perda de XP diária e tempestade.</p>
    <div class="row"><button class="danger" data-act="confirmSkip">Pular mesmo assim</button><button class="primary" data-act="back">Melhor estudar</button></div></div>`);
  $('modalCard').dataset.id = id;
}
const SEAL = `<svg width="124" height="124" viewBox="0 0 132 132" aria-hidden="true"><path d="M66 4 C80 10 92 6 102 16 C112 26 108 38 116 50 C124 62 128 74 120 86 C112 98 116 110 104 118 C92 126 80 122 66 128 C52 122 40 126 28 118 C16 110 20 98 12 86 C4 74 8 62 16 50 C24 38 20 26 30 16 C40 6 52 10 66 4 Z" fill="#9B2C36"/><circle cx="66" cy="66" r="42" fill="none" stroke="#C9545F" stroke-width="2"/><g transform="translate(66,66)" fill="none" stroke="#F4D9C2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -22v44M-12 22h24M-18 -12h36M-18 -12l-7 14a7 7 0 0 0 14 0zM18 -12l-7 14a7 7 0 0 0 14 0z"/></g></svg>`;
function weekModal(w, celebrate) {
  const list = S.tiles.filter(t => t.week === w), done = S.weeks[w];
  const n = D.diff(D.monday(S.tiles[0].date), w) / 7 + 1;
  const secOf = e => e.sec || (e.min || 0) * 60;
  const rows = list.map(t => {
    const st = t.history.find(e => e.t === 'study'), revs = t.history.filter(e => e.t === 'review');
    return { t, study: st ? secOf(st) : 0, src: st?.src, nRev: revs.length, rev: revs.reduce((a, e) => a + secOf(e), 0) };
  });
  const tot = rows.reduce((a, r) => a + r.study + r.rev, 0);
  const rowsHtml = `<div class="card" style="padding:4px 14px;margin-top:14px">${rows.map(r => `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)">
      <span style="width:10px;height:10px;border-radius:50%;background:${discColor(r.t.discN)}"></span><span style="flex-grow:1;font-weight:600;font-size:14px">${esc(lessonLabel(r.t))}</span>
      <span class="note">${r.t.status === 'done' ? `${r.src === 'kindle' ? 'Kindle' : 'estudo'}${r.nRev ? ` + ${r.nRev} rev.` : ''}` : r.t.off ? 'dispensada' : r.t.status === 'pending' ? 'pendente' : 'a fazer'}</span>
      <span style="font-weight:700;width:76px;text-align:right">${r.study + r.rev ? fmtDur(r.study + r.rev).replace(/ \d+ s$/, '') : '—'}</span></div>`).join('')}
      <div style="display:flex;justify-content:space-between;padding:12px 0 10px" class="serif"><span style="font-size:20px;font-weight:700">Tempo da semana</span><span style="font-size:20px;font-weight:700">${fmtDur(tot)}</span></div></div>`;
  if (celebrate && done) {
    burst(160);
    document.body.insertAdjacentHTML('beforeend', '<div class="rays"></div>');
    openModal(`<div class="body"><div class="seal-wrap">${SEAL}</div>
      <div class="kicker" style="text-align:center;color:var(--gold-ink);margin-top:6px">Pauta da semana ${n} · ${D.br(w)} a ${D.br(D.add(w, 6))}</div>
      <h2 class="serif" style="text-align:center;font-size:38px;margin:4px 0 0;line-height:1.05">${done.perfect ? 'Acórdão unânime' : 'Transitada em julgado'}</h2>
      <div class="row" style="justify-content:center"><span style="font-weight:700;background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:6px 12px">+${CONFIG.weekBonus} honorários</span><span style="font-weight:600;border:1px solid var(--gold);color:var(--gold-ink);border-radius:999px;padding:6px 12px">${done.perfect ? 'pórtico de ouro' : 'pórtico aceso'}</span></div>
      ${rowsHtml}<div class="row"><button class="primary" data-act="close">Seguir na trilha</button></div></div>`, 'celebrate');
    return;
  }
  openModal(`${head(`${D.br(w)} a ${D.br(D.add(w, 6))}`, `Pauta da semana ${n}${done ? (done.perfect ? ' — acórdão unânime' : ' — transitada em julgado') : ''}`)}
    <div class="body">${done ? `<p>+${CONFIG.weekBonus} honorários · trânsito em julgado em ${fmtDay(done.day)}${done.perfect ? ' · nenhuma aula pulada' : ''}.</p>` : `<p>Vença todas as casas desta semana para a pauta transitar em julgado (+${CONFIG.weekBonus}). Sem nenhum pulo, acórdão unânime.</p>`}${rowsHtml}</div>`);
}
function arrivalScreen() {
  closeModal(); burst(320);
  const el = document.createElement('div'); el.className = 'arrival';
  el.innerHTML = `<div class="kicker" style="color:var(--gold);letter-spacing:3px">Sessão encerrada</div><h1>Pauta zerada!</h1>
    <p style="max-width:420px;color:#D9DEE8;line-height:1.5;margin:0">Você alcançou a última aula disponível. Toga completa: ${RANKS[S.traje]}. +${CONFIG.ptsArrival} honorários.</p>
    <div style="width:200px;height:200px;border-radius:50%;background:#0E1526;box-shadow:0 0 0 4px #C9A75A,0 0 60px rgba(201,167,90,.6);display:flex;align-items:center;justify-content:center"><svg width="150" height="190" viewBox="-45 -112 90 118">${figureSVG(S.traje)}</svg></div>
    <p class="note" style="color:#AEB6C8">Quando a próxima aula entrar, o fim se afasta e a toga volta a estar em jogo.</p>

  el.querySelector('#arrOk').onclick = () => el.remove();
}
function showReportModal(r, auto) {
  const li = a => a.map(x => `<li>${x}</li>`).join('');
  openModal(`${head(`Varredura das pastas${auto ? ' · mudanças detectadas' : ''}`, `${r.total} casa(s) na pauta`)}
    <div class="body">
    ${r.added.length ? `<h3>Novas casas</h3><p class="note">Cada aula nova afasta o fim da pauta.</p><ul>${li(r.added.map(l => `${esc(lessonLabel(l))} — ${esc(l.title)} <span class="note">(${D.br(l.date)})</span>`))}</ul>` : ''}
    ${r.removed.length ? `<h3>Saíram da pauta</h3><p class="note">O progresso delas fica guardado e volta se a aula voltar.</p><ul>${li(r.removed.map(l => `${esc(lessonLabel(l))} — ${esc(l.title)}`))}</ul>` : ''}
    ${!r.added.length && !r.removed.length ? '<p>Nada mudou desde a última varredura.</p>' : ''}
    ${r.problems?.length ? `<h3>Pastas de aula que não entraram (${r.problems.length})</h3><ul>${li(r.problems.map(x => `<b>${esc(x.path)}</b><br><span class="note">${esc(x.reason)}</span>`))}</ul>` : ''}
    <details><summary><b>Outras pastas ignoradas (${r.ignored.length})</b></summary>
    ${r.ignored.length ? `<ul>${li(r.ignored.map(x => `<b>${esc(x.path)}</b><br><span class="note">${esc(x.reason)}</span>`))}</ul>` : '<p class="note">Nenhuma.</p>'}</details>
    <div class="row"><button class="primary" data-act="close">Fechar</button></div></div>`);
}
function journalHTML(days) {
  return days.map(d => `<div class="day">${fmtDay(d)}</div>${S.journal[d].map(it => `<div class="it ${it.kind}">${esc(it.text)}</div>`).join('')}`).join('');
}
function awayModal(days) {
  const losses = days.filter(d => S.journal[d]?.some(it => it.kind !== 'gain'));
  if (!losses.length) return;
  openModal(`${head('Relatório de ausência', 'Enquanto você esteve fora…', '', '#3A1A20')}
    <div class="body"><div class="journal">${journalHTML(losses)}</div><div class="row"><button class="primary" data-act="close">Voltar ao jogo</button></div></div>`);
}

      <div class="kicker" style="margin-top:18px">Situação no semestre</div>

        <label>Prova feita · dispensar aulas restantes<input type="checkbox" data-conclude="${d.n}" ${S.concluded[d.n] ? 'checked' : ''}></label>
        ${S.concluded[d.n] ? '<div class="note">As aulas restantes saíram do "faltam N", não punem nem desbotam. O que já foi vencido continua no histórico.</div>' : ''}</div>`).join('')}</div>

  document.querySelectorAll('input[name=foco]').forEach(r => r.onchange = () => { addEvent({ t: 'focus', disc: r.value ? +r.value : null }); renderTrail.scrolled = false; discsModal(); });

function rulesModal() {
  const C = CONFIG;

// ---------- sessão (cronômetro com pausa) ----------
function startSession(id, kind, src, mode) {
  const t = S.tiles.find(x => x.id === id);
  const mirror = mode === 'espelho';
  DATA.session = { id, kind, src, mode: mode || null, acc: 0, runStart: Date.now(), beat: Date.now(), need: mirror ? CONFIG.mirrorMin : kind === 'study' ? CONFIG.studyMin : CONFIG.reviewMin };
  save(); renderPill();
  if (src === 'pc' && !mirror) { closeModal(); openLesson(t); } else tileModal(id);
}
function pauseSession(auto) {
  const s = DATA.session; if (!s || !s.runStart) return;
  s.acc = elapsed(s); s.runStart = null; s.autoPaused = !!auto;
  save(); renderPill(); renderReaderChip(); tick();
}
function resumeSession() {
  const s = DATA.session; if (!s || s.runStart) return;
  s.runStart = Date.now(); s.beat = Date.now(); s.autoPaused = false;
  save(); renderPill(); renderReaderChip(); tick();
}
const togglePause = () => DATA.session?.runStart ? pauseSession(false) : resumeSession();
function finishSession() {
  const s = DATA.session; if (!s) return;
  const el = elapsed(s); if (el < s.need * 60e3) return;
  if (s.runStart) { s.acc = el; s.runStart = null; }
  const base = { t: s.kind, id: s.id, src: s.src, dev: isMobile() ? 'mobile' : 'pc', min: Math.round(el / 6e4), sec: Math.round(el / 1000) };
  $('reader').classList.remove('on'); readerLesson = null;
  // estudo → Arranco da Gaveta; Espelho Cego → autoavaliação

  DATA.session = null; closeModal();
  addEvent(base);
}

let beatSaved = 0;
function tick() {
  const s = DATA.session; if (!s) return;

  if (s.stage === 'recall') {
    const rleft = CONFIG.recallMin * 60e3 - (Date.now() - s.recallStart), txt = (s.draft || '').trim().length;
    $('pillT').textContent = rleft > 0 ? clock(Math.ceil(rleft / 1000)) : 'pronto'; $('pillBtn').textContent = 'Abrir';
    if ($('rTimer')) {
      $('rTimer').textContent = rleft > 0 ? clock(Math.ceil(rleft / 1000)) : 'pronto'; $('rTimer').classList.toggle('over', rleft <= 0);
      $('rCount').textContent = `${txt}/${CONFIG.recallChars}`; $('rCount').className = 'counter ' + (txt >= CONFIG.recallChars ? 'okc' : '');

  const left = s.need * 60e3 - elapsed(s);

    $('mTimerSub').textContent = !s.runStart ? 'Pausado' : left <= 0 ? 'Mínimo cumprido: o relógio conta todo o tempo' : 'Contagem do tempo mínimo';
  }
}

// ---------- efeitos ----------
function toast(msg, bad) { const d = document.createElement('div'); d.className = 'toast' + (bad ? ' bad' : ''); d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2500); }
const conf = { parts: [], raf: 0 };
function burstAt(x, y, n, up = false) {
  const c = $('confetti'), ctx = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#C9A75A', '#E8D6A6', '#2F5D8A', '#B7791F', '#2F6B4F', '#9B2C36', '#F4EFE4'];
  for (let i = 0; i < n; i++) conf.parts.push({ x: x + (Math.random() - .5) * 40, y, vx: (Math.random() - .5) * 12, vy: up ? -Math.random() * 13 - 4 : Math.random() * 4 + 1, r: Math.random() * 6 + 3, c: cols[i % cols.length], a: Math.random() * 6, life: 110 + Math.random() * 60 });
  if (conf.raf) return;
  const loop = () => {
    ctx.clearRect(0, 0, c.width, c.height);
    conf.parts = conf.parts.filter(p => p.life-- > 0);
    for (const p of conf.parts) { p.vy += .3; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); }
    conf.raf = conf.parts.length ? requestAnimationFrame(loop) : 0;
  };
  conf.raf = requestAnimationFrame(loop);
}
const burst = n => burstAt(innerWidth / 2, innerHeight / 3, n, true);
// chuva de confete saindo de toda a borda de cima da tela
function burstTop(n) {
  for (let k = 0; k < 8; k++) burstAt((k + .5) * innerWidth / 8, -10, Math.ceil(n / 8));
  conf.parts.forEach(p => { if (p.y < 0) { p.x = Math.random() * innerWidth; p.y = -Math.random() * 120; p.vx = (Math.random() - .5) * 3; p.vy = Math.random() * 2 + 1; } });
}
const rain = { drops: [], raf: 0, level: 0, nextFlash: 0 };
function weather() {
  rain.level = S.storm;
  const c = $('rain');
  if (rain.level < 2) { cancelAnimationFrame(rain.raf); rain.raf = 0; c.getContext('2d').clearRect(0, 0, c.width, c.height); return; }
  if (rain.raf) return;
  const ctx = c.getContext('2d');
  const loop = t => {
    if (c.width !== innerWidth) { c.width = innerWidth; c.height = innerHeight; }
    const want = rain.level === 3 ? 240 : 110;
    while (rain.drops.length < want) rain.drops.push({ x: Math.random() * c.width, y: Math.random() * c.height, l: 10 + Math.random() * 14, v: 9 + Math.random() * 8 });
    ctx.clearRect(0, 0, c.width, c.height); ctx.strokeStyle = 'rgba(220,228,240,.4)'; ctx.lineWidth = 1.1; ctx.beginPath();
    for (const d of rain.drops) { d.y += d.v; d.x -= d.v * .25; if (d.y > c.height) { d.y = -20; d.x = Math.random() * c.width * 1.2; } ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.l * .25, d.y - d.l); }
    ctx.stroke();
    if (t > rain.nextFlash) {
      if (rain.nextFlash) { const f = $('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
      rain.nextFlash = t + (rain.level === 3 ? 4000 + Math.random() * 5000 : 12000 + Math.random() * 9000);
    }
    rain.raf = requestAnimationFrame(loop);
  };
  rain.raf = requestAnimationFrame(loop);
}

// ---------- cliques ----------
document.addEventListener('click', e => {
  const open = e.target.closest('[data-open]');
  if (open) { e.preventDefault(); tileModal(open.dataset.open); return; }
  const nd = e.target.closest('.nd[data-id]'); if (nd) return tileModal(nd.dataset.id);
  const gate = e.target.closest('.gate[data-week]'); if (gate) return weekModal(gate.dataset.week);
  if (e.target.id === 'modal') return closeModal();
  if (e.target.id === 'btnConnect') return IS_WEB ? cloudLogin() : connectFolder();
  const a = e.target.closest('[data-act]'); if (!a) return;
  const id = $('modalCard').dataset.id;
  switch (a.dataset.act) {
    case 'close': closeModal(); break;
    case 'back': tileModal(id); break;
    case 'start': startSession(id, a.dataset.kind, a.dataset.src, a.dataset.mode); break;
    case 'openSession': { const s = DATA.session; if (!s) break; if (!s.stage && s.src === 'pc' && s.mode !== 'espelho') { closeModal(); openLesson(S.tiles.find(x => x.id === s.id)); } else tileModal(s.id); break; }
    case 'togglePause': togglePause(); tileModal(id); break;
    case 'saveRecall': {
      const hook = $('rHook').value.trim();
      closeSessionWith({ recall: $('rText').value.trim(), recallSec: Math.round((Date.now() - DATA.session.recallStart) / 1000), ...(hook ? { hook } : {}) });
      break;
    }
    case 'mirrorOk': closeSessionWith({ mode: 'espelho', mirror: 'ok' }); break;
    case 'mirrorFail': closeSessionWith({ mode: 'espelho', mirror: 'falhou' }); toast('Casa marcada para reforço', true); break;
    case 'anchors': anchorsModal(); break;
    case 'discs': discsModal(); break;
    case 'read': { closeModal(); const t = S.tiles.find(x => x.id === id); if (t) openLesson(t); break; }
    case 'logout': closeModal(); MSAL?.logoutRedirect({ account }); break;
    case 'later': laterModal(id, a.dataset.kind); break;
    case 'saveLater': {
      const entry = { t: a.dataset.kind, id, src: 'kindle', manual: true, day: $('kDay').value, min: +$('kMin').value, note: $('kNote').value.trim() };
      if ($('kHook')?.value.trim()) entry.hook = $('kHook').value.trim();
      closeModal(); addEvent(entry); break;
    }
    case 'finish': finishSession(); break;
    case 'cancel': DATA.session = null; save(); renderPill(); tileModal(id); break;
    case 'skip': skipModal(id); break;
    case 'confirmSkip': closeModal(); addEvent({ t: 'skip', id }); break;
    case 'rules': rulesModal(); break;
    case 'wardrobe': wardrobeModal(); break;
    case 'journal': journalModal(); break;
    case 'export': exportData(); break;
    case 'import': $('importInput').click(); break;
    case 'connect': closeModal(); IS_WEB ? cloudLogin() : connectFolder(); break;
    case 'disconnect': dirHandle = null; idbDel('dir'); closeModal(); render(); break;
  }
});
