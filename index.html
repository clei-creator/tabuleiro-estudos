$('btnMenu').onclick = menuModal;
$('tabHoje').onclick = () => setView('hoje');
$('tabMapa').onclick = () => setView('mapa');
$('readerX').onclick = closeReader;
$('rPause').onclick = togglePause;
$('rDone').onclick = finishSession;
$('pillPause').onclick = togglePause;
$('pillBtn').onclick = () => { const s = DATA.session; if (!s) return; if (!s.stage && s.src === 'pc' && s.mode !== 'espelho') openLesson(S.tiles.find(x => x.id === s.id)); else tileModal(s.id); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('reader').classList.contains('on')) closeReader(); else closeModal(); } });

// ---------- tema (preferência deste aparelho) ----------
const THEME_KEY = 'tabuleiro10:tema', themeMQ = matchMedia('(prefers-color-scheme: dark)');
const THEME_NAMES = { auto: 'Tema automático (segue o aparelho)', dark: 'Modo noturno', light: 'Modo claro' };
const themePref = () => { try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; } };
function applyTheme() {
  const pref = themePref(), dark = pref === 'dark' || (pref === 'auto' && themeMQ.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelector('meta[name="theme-color"]').content = dark ? '#0B1120' : '#1B2740';
  $('btnTheme').innerHTML = ic({ auto: 'auto', dark: 'moon', light: 'sun' }[pref]);
  $('btnTheme').title = THEME_NAMES[pref] + ' — clique para trocar';
}
$('btnTheme').onclick = () => {
  const order = ['auto', 'dark', 'light'], next = order[(order.indexOf(themePref()) + 1) % order.length];
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* sem storage */ }
  applyTheme(); toast(THEME_NAMES[next]);
};
themeMQ.addEventListener('change', applyTheme);
applyTheme();
$('dirInput').onchange = async e => { if (e.target.files.length) await applyScan(listFromFileList(e.target.files), true); e.target.value = ''; };
$('importInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!Array.isArray(d.events)) throw new Error('arquivo sem eventos'); DATA = mergeData(DATA, d); save(); render(); toast('Backup importado'); }
  catch (err) { toast('Backup inválido: ' + err.message, true); }
  e.target.value = '';
};
function exportData() {
  const blob = new Blob([JSON.stringify(DATA, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tabuleiro-backup-${today()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!S) return; view === 'hoje' ? renderTrail() : renderMap(); }, 150); });

// ---------- início ----------
(async function init() {
  if (!DATA.startDay) DATA.startDay = today();
  // sessões antigas (sem pausa) e sessões que estavam correndo quando a página fechou
  const s = DATA.session;
  if (s && s.acc == null) { s.acc = 0; s.runStart = s.start || Date.now(); }
  if (s && s.runStart && !s.stage && s.src !== 'kindle') { s.acc += Math.max(0, (s.beat || s.runStart) - s.runStart); s.runStart = null; s.autoPaused = true; }
  render();
  if (IS_WEB) {
    try { await cloudInit(); } catch (e) { toast('Falha no login: ' + e.message, true); }
    if (account) { try { await syncFromRemote(false); } catch (e) { toast('Falha ao ler o OneDrive: ' + e.message, true); } }
    render();
  }
  const h = IS_WEB ? null : await idbGet('dir');
  if (h) {
    dirHandle = h;
    try { if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted') await syncFromRemote(false); else dirHandle = null, window._pendingHandle = h; }
    catch (e) { dirHandle = null; }
    render();
  }
  if (!connected() && !DATA.lessons?.length && !window._pendingHandle) {
    openModal(`${head('Bem-vindo(a)', 'Tabuleiro de Estudos')}
      <div class="body"><p>Cada aula fichada é uma casa na trilha até a última aula disponível. Quanto mais perto do fim, mais completo o seu traje — até a toga. Avance todo dia, revise na hora certa e fuja da tempestade.</p>
      <p>${IS_WEB ? 'Para começar, entre com sua conta Microsoft: o jogo lê as aulas e o progresso direto do seu OneDrive.' : 'Para começar, selecione a pasta <b>10º</b> (a mesma onde este arquivo está). O jogo vai ler as aulas e salvar seu progresso lá.'}</p>
      <div class="row"><button class="gold" data-act="connect">${IS_WEB ? 'Entrar com a conta Microsoft' : 'Selecionar pasta 10º'}</button><button class="ghost" data-act="rules">Como jogar</button></div></div>`);
  } else if (DATA.lastSeen && DATA.lastSeen < today()) {
    const days = Object.keys(S.journal).filter(d => d >= DATA.lastSeen && d < today()).sort();
    awayModal(days);
  }
  DATA.lastSeen = today(); save();
})();
// reconectar com um clique quando a permissão expirou
document.addEventListener('click', async e => {
  if (e.target.id !== 'btnConnect' || !window._pendingHandle) return;
  e.stopImmediatePropagation();
  const h = window._pendingHandle;
  if ((await h.requestPermission({ mode: 'readwrite' })) === 'granted') { dirHandle = h; window._pendingHandle = null; await syncFromRemote(false); }
}, true);
</script>
</body>
</html>
