<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d2433">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tabuleiro de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2433; --ink-soft:#4b5568; --paper:#fffaf0; --card:#ffffff; --line:#e6dcc8;
  --gold:#f6b60c; --gold-deep:#c98a00; --danger:#d7263d; --danger-deep:#7a0f1c; --ok:#1fa463;
  --path:#f3e3bf; --path-edge:#d9c39a; --progress:#ffcf3f;
  --sky-a:#8fd3ff; --sky-b:#e8f7ff; --ground:#9ad37a;
  --radius:16px;
  --font-title:"Fredoka", "Segoe UI", system-ui, sans-serif;
  --font-body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font-body); color:var(--ink);
  background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 55%,#f6fbe9 100%);
  background-attachment:fixed; transition:background 1.2s ease;
  overflow-x:hidden;
}
body.storm-1{--sky-a:#a9bccb;--sky-b:#dfe6ea}
body.storm-2{--sky-a:#4d5a69;--sky-b:#8d98a3;--path:#d8ccb4;--path-edge:#a8977a}
body.storm-3{--sky-a:#141a24;--sky-b:#39414d;--path:#b9ad97;--path-edge:#7f715a}
body.storm-2 .hud, body.storm-3 .hud{background:rgba(25,30,40,.82);color:#f1f3f7}
body.storm-2 .hud .chip, body.storm-3 .hud .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#f1f3f7}
body.storm-2 .today, body.storm-3 .today, body.storm-2 .legend, body.storm-3 .legend{background:rgba(25,30,40,.75);color:#eef1f6;border-color:rgba(255,255,255,.12)}
.scene{position:fixed;left:0;right:0;bottom:0;width:100%;height:34vh;z-index:1;pointer-events:none;color:#1f2d4d;opacity:.12;transition:color 1.2s, opacity 1.2s}
body.storm-2 .scene, body.storm-3 .scene{color:#05070b;opacity:.35}
#rain,#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
#confetti{z-index:60}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
#flash.on{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.85}15%{opacity:.1}25%{opacity:.6}100%{opacity:0}}
.clouds{position:fixed;inset:0 0 auto 0;height:220px;pointer-events:none;z-index:0;opacity:.0;transition:opacity 1.2s}
body.storm-1 .clouds{opacity:.55} body.storm-2 .clouds{opacity:.85} body.storm-3 .clouds{opacity:1}
.clouds span{position:absolute;top:var(--t);left:-30%;width:var(--w);height:calc(var(--w)*.38);border-radius:999px;
  background:radial-gradient(circle at 30% 40%,#cfd6de,#8a95a2 70%);filter:blur(2px);animation:drift var(--d) linear infinite;animation-delay:var(--dl)}
body.storm-3 .clouds span{background:radial-gradient(circle at 30% 40%,#4a5361,#1d232c 70%)}
@keyframes drift{to{transform:translateX(170vw)}}

/* HUD */
.hud{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  padding:10px 16px;background:rgba(255,250,240,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);transition:background 1s}
.brand{font-family:var(--font-title);font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand small{font-family:var(--font-body);font-weight:600;font-size:.75rem;opacity:.65}
.stats{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-weight:700;font-size:.9rem;white-space:nowrap}
.chip small{font-weight:600;opacity:.65}
.chip.bad{background:#ffe3e6;border-color:#f3a3ad;color:var(--danger-deep)}
.chip.lvl .bar{width:64px;height:8px;border-radius:9px;background:rgba(0,0,0,.12);overflow:hidden}
.chip.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,#6dd5ff,#7c5cff)}
.actions{display:flex;gap:8px}
button{font-family:var(--font-title);font-weight:600;font-size:.95rem;border:0;border-radius:12px;padding:9px 14px;cursor:pointer;
  background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .08s, filter .15s}
button:hover{filter:brightness(1.05)} button:active{transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:linear-gradient(180deg,#ffd54a,#f6a90c);color:#3b2600}
button.go{background:linear-gradient(180deg,#43d17f,#1fa463);color:#fff}
button.kindle{background:linear-gradient(180deg,#5a6b7d,#36424f);color:#fff}
button.danger{background:linear-gradient(180deg,#ff5c6f,#c41d33);color:#fff}
button.ghost{background:transparent;box-shadow:none;border:1px solid var(--line)}
.sim{background:#7c5cff;color:#fff;border-color:#7c5cff}

.today{margin:12px 16px 0;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.75);border:1px solid var(--line);
  font-weight:700;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.today .late{color:var(--danger)}
#warn{margin:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.warn{padding:10px 14px;border-radius:12px;font-weight:800;color:#fff;background:linear-gradient(90deg,#7a0f1c,#d7263d);
  box-shadow:0 0 0 2px rgba(215,38,61,.25),0 6px 18px rgba(122,15,28,.35);animation:throb 1.8s ease-in-out infinite;letter-spacing:.01em}
.warn.soft{background:linear-gradient(90deg,#8a5a00,#d08b00);animation:none}
.warn.dark{background:linear-gradient(90deg,#10141b,#3a1020)}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.008);box-shadow:0 0 0 4px rgba(215,38,61,.35),0 6px 22px rgba(122,15,28,.5)}}

main{position:relative;z-index:2;display:grid;grid-template-columns:1fr;gap:12px;padding:12px 16px 120px}
.board-wrap{width:100%}
#board{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.75);border:1px solid var(--line);font-size:.88rem}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.legend em{font-style:normal;font-weight:600;opacity:.7}

/* board svg */
.tile{cursor:pointer;transition:filter .6s}
.tile .base{stroke:rgba(0,0,0,.18);stroke-width:2}
.tile text{font-family:var(--font-title);pointer-events:none;text-anchor:middle}
.tile .num{font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.25);stroke-width:3px}
.tile .sig{font-weight:600;fill:#fff;opacity:.95}
.tile .dt{font-weight:500;fill:#fff;opacity:.85}
.tile.st-locked .num,.tile.st-locked .sig,.tile.st-locked .dt{fill:#e9edf3;stroke:none}
.tile.st-current .ring{animation:ring 1.3s ease-in-out infinite}
@keyframes ring{0%,100%{stroke-opacity:.95;stroke-width:5}50%{stroke-opacity:.3;stroke-width:9}}
.tile.st-pending .base{animation:pend 1.1s ease-in-out infinite}
@keyframes pend{0%,100%{stroke:#ff3b52;stroke-width:3}50%{stroke:#ffd1d6;stroke-width:6}}
.tile .shimmer{animation:shim 2.6s ease-in-out infinite;pointer-events:none}
@keyframes shim{0%,100%{opacity:0}50%{opacity:.45}}
.tile:hover{filter:brightness(1.08)}
.gem{stroke:#fff;stroke-width:1.5}
.chest{cursor:pointer}
.chest text{text-anchor:middle;font-family:var(--font-title);pointer-events:none}
.lb{paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:4px;stroke-linejoin:round}
.today a{color:inherit;text-decoration:none;border-bottom:2px dotted currentColor}
.chest.done .glow{animation:chestglow 2.4s ease-in-out infinite}
@keyframes chestglow{0%,100%{opacity:.35}50%{opacity:.9}}
#pawn{transition:transform .32s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
#pawn .bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.crack{stroke:#1b0d0d;stroke-width:2.2;fill:none;stroke-linecap:round;opacity:.75}

/* session pill */
#pill{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;display:none;align-items:center;gap:12px;
  padding:10px 12px 10px 18px;border-radius:999px;background:#1d2433;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35);font-weight:800;max-width:calc(100vw - 32px)}
#pill.on{display:flex}
#reader{position:fixed;inset:0;z-index:55;background:#fff;display:none;flex-direction:column}
#reader.on{display:flex} #reader.on ~ #pill{z-index:58}
.rbar{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#1d2433;color:#fff;font-weight:700}
.rbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#reader iframe{flex:1;border:0;width:100%}
#pill .t{font-family:var(--font-title);font-size:1.3rem;font-variant-numeric:tabular-nums}
#pill .l{font-size:.85rem;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,20,30,.55);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.card{background:var(--paper);border-radius:22px;max-width:620px;width:100%;max-height:calc(100vh - 32px);overflow:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .25s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.card .head{padding:18px 20px;border-radius:22px 22px 0 0;color:#fff;position:relative}
.card .head h2{margin:4px 0 0;font-family:var(--font-title);font-size:1.35rem;line-height:1.2}
.card .head .meta{font-weight:700;opacity:.92;font-size:.9rem}
.card .x{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.25);color:#fff;box-shadow:none;padding:6px 11px}
.card .body{padding:16px 20px 20px}
.card h3{font-family:var(--font-title);margin:14px 0 8px;font-size:1.05rem}
.card p{margin:8px 0;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.hist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.hist li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.9rem}
.hist li .n{display:block;margin-top:4px;font-style:italic;color:var(--ink-soft);white-space:pre-wrap}
.note{font-size:.85rem;color:var(--ink-soft)}
.timer{font-family:var(--font-title);font-size:2.4rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.timer.over{color:var(--ok)} #pill .t.over{color:#6ef0a5}
textarea,input[type=number],select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff}
textarea{min-height:120px;resize:vertical}
label{font-weight:700;font-size:.9rem;display:block;margin:10px 0 4px}
.counter{font-size:.8rem;font-weight:700;text-align:right}
.counter.okc{color:var(--ok)} .counter.no{color:var(--danger)}
.rep li{margin:4px 0}
.journal .day{margin:10px 0 4px;font-family:var(--font-title);font-weight:600}
.journal .it{font-size:.9rem;padding:3px 0 3px 10px;border-left:3px solid var(--line)}
.journal .it.loss{border-color:var(--danger);color:var(--danger-deep)}
.journal .it.gain{border-color:var(--ok)}
.journal .it.shield{border-color:#3b82f6}
.big{font-size:3.4rem;text-align:center;margin:6px 0}
.center{text-align:center}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:70;font-family:var(--font-title);font-weight:700;font-size:1.4rem;
  color:#fff;background:#1fa463;padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toast 2.2s ease forwards}
.toast.bad{background:var(--danger)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
.welcome{max-width:640px;margin:40px auto;padding:0 16px;position:relative;z-index:3}
.welcome .card{animation:none}
@media (max-width:640px){
  .brand small{display:none}
  .chip{font-size:.8rem;padding:5px 8px}
  .chip.lvl .bar{width:40px}
  .timer{font-size:2rem}
}
</style>
</head>

<script>
// ==ENGINE== (funções puras: varredura das pastas e replay do log de eventos)
const CONFIG = {
  studyMin: 15,          // minutos mínimos para vencer uma casa
  reviewMin: 5,          // minutos mínimos para uma revisão
  kindleChars: 100,      // caracteres mínimos do diário de bordo (estudo no Kindle)
  kindleReviewChars: 60, // idem para revisão no Kindle
  startPts: 30, skipCost: 15,
  xpStudy: 20, xpReview: 5, xpPerLevel: 100,
  ptsReview: 5, ptsReviewFaded: 10,
  idleXp: 15, debtXp: 10, weekBonus: 30,
  fadeStart: 7, fadeFull: 21, maxLevel: 4,
  colors: ['#e8504a', '#2f8fe0', '#f29f05', '#22a865', '#9b59e0', '#e0559b', '#16a3a3'],
};
const RE = {
  disc: /^(\d+)\.\s*(.+?)\s*¦\s*(.+)$/,
  lesson: /^(\d{6})\s*-\s*A(\d+)\s*-/,
  fic: /^A(\d+)\s*¦\s*(\d{6})\s*¦\s*FIC\s*¦\s*(.+?)\.html?$/i,
  prod: /^01_Produ(c|ç)(a|ã)o$/i,
};
const D = {
  key(dt) { return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`; },
  parse(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); },
  add(k, n) { const t = D.parse(k); t.setDate(t.getDate() + n); return D.key(t); },
  diff(a, b) { return Math.round((D.parse(b) - D.parse(a)) / 864e5); },
  monday(k) { const t = D.parse(k); t.setDate(t.getDate() - (t.getDay() + 6) % 7); return D.key(t); },
  fromYYMMDD(s) {
    const y = 2000 + +s.slice(0, 2), m = +s.slice(2, 4), d = +s.slice(4, 6), t = new Date(y, m - 1, d);
    return t.getMonth() === m - 1 && t.getDate() === d ? D.key(t) : null;
  },
  br(k) { const [, m, d] = k.split('-'); return `${d}/${m}`; },
  wd(k) { return ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][D.parse(k).getDay()]; },
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const decodeEntities = s => s.replace(/&(amp|lt|gt|quot|#39|nbsp);/g, (_, e) => ({ amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'", nbsp: ' ' })[e]).replace(/\s+/g, ' ');

// files: [{rel:'Disc/Aula/01_Produção/arquivo.html', read:()=>Promise<string>}]; dirs: ['Disc/Subpasta', ...]
async function buildLessons(files, dirs) {
  const N = s => s.normalize('NFC');
  const report = { ignored: [], problems: [] };
  const byDir = new Map();
  for (const f of files) {
    const seg = N(f.rel).split('/');
    if (seg.length !== 4 || !RE.prod.test(seg[2])) continue;
    const k = seg[0] + '/' + seg[1];
    if (!byDir.has(k)) byDir.set(k, []);
    byDir.get(k).push({ name: seg[3], rel: seg.join('/'), read: f.read });
  }
  const lessons = [], seenTop = new Set(), seenId = new Set();
  for (const dRel of [...new Set(dirs.map(N))].sort()) {
    const seg = dRel.split('/');
    if (seg.length !== 2 || seg[0].startsWith('_') || seg[0].startsWith('.')) continue;
    const [top, sub] = seg;
    const dm = top.match(RE.disc);
    if (!dm) {
      if (!seenTop.has(top)) { seenTop.add(top); report.ignored.push({ path: top, reason: 'pasta fora do padrão "N. Disciplina ¦ Professor"' }); }
      continue;
    }
    if (/^AAMMDD/i.test(sub)) continue; // pasta-modelo
    if (!RE.lesson.test(sub)) { report.ignored.push({ path: dRel, reason: 'não é pasta de aula (ex.: "1ª Unidade") — ignorada com tudo dentro' }); continue; }
    const cands = (byDir.get(dRel) || []).filter(x => RE.fic.test(x.name)).sort((a, b) => a.name.localeCompare(b.name));
    if (!cands.length) { report.problems.push({ path: dRel, reason: 'sem "Ann ¦ AAMMDD ¦ FIC ¦ Sigla.html" direto em 01_Produção' }); continue; }
    const f = cands[0], fm = f.name.match(RE.fic), date = D.fromYYMMDD(fm[2]);
    if (!date) { report.problems.push({ path: f.rel, reason: 'data inválida no nome do arquivo' }); continue; }
    const num = +fm[1], sigla = fm[3].trim();
    const id = `${sigla}-${fm[2]}-A${String(num).padStart(2, '0')}`;
    if (seenId.has(id)) { report.problems.push({ path: f.rel, reason: `aula duplicada (${id})` }); continue; }
    seenId.add(id);
    let title = '';
    try { const tm = (await f.read()).match(/<title[^>]*>([\s\S]*?)<\/title>/i); if (tm) title = decodeEntities(tm[1]).trim(); } catch (e) { /* sem título */ }
    lessons.push({ id, sigla, num, date, discN: +dm[1], discName: dm[2].trim(), prof: dm[3].trim(), title: title || `Aula ${num}`, path: f.rel });
  }
  lessons.sort((a, b) => a.date.localeCompare(b.date) || a.discN - b.discN || a.num - b.num);
  return { lessons, report };
}

function lessonLabel(L, id) { return L ? `${L.sigla} A${String(L.num).padStart(2, '0')}` : id; }

// data: {startDay, events:[{uid,t:'study'|'review'|'skip',id,day,ts,src,min,note}]}
function replay(data, lessons, today) {
  const C = CONFIG;
  const byId = Object.fromEntries(lessons.map(l => [l.id, l]));
  const T = {};
  const tile = id => T[id] || (T[id] = { status: 'locked', reviews: [], history: [], level: 0, lastTouch: null, skipDay: null, studiedDay: null, src: null, everSkipped: false });
  const s = { studySec: 0, points: C.startPts, xp: 0, streak: 0, best: 0, idleRun: 0, shields: {}, weeks: {}, journal: {}, srcCount: { pc: 0, kindle: 0 }, todayAdvanced: false };
  const weekLessons = {};
  for (const l of lessons) (weekLessons[D.monday(l.date)] ||= []).push(l.id);
  const evs = data.events.filter(e => e.day <= today).sort((a, b) => a.day.localeCompare(b.day) || a.ts.localeCompare(b.ts));
  const start = data.startDay;
  const first = evs.length && evs[0].day < start ? evs[0].day : start;
  const note = (d, kind, text) => (s.journal[d] ||= []).push({ kind, text });
  const available = () => lessons.some(l => (T[l.id]?.status || 'locked') !== 'done');
  let i = 0;
  for (let d = first; d <= today; d = D.add(d, 1)) {
    let advanced = false;
    while (i < evs.length && evs[i].day === d) {
      const e = evs[i++], t = tile(e.id), lab = lessonLabel(byId[e.id], e.id);
      if (e.t !== 'skip') s.studySec += e.sec || (e.min || 0) * 60;
      if (e.t === 'study') {
        if (t.status === 'done') continue;
        const wasPending = t.status === 'pending';
        Object.assign(t, { status: 'done', studiedDay: d, lastTouch: d, src: e.src, skipDay: null });
        t.history.push(e); s.xp += C.xpStudy; s.srcCount[e.src] = (s.srcCount[e.src] || 0) + 1; advanced = true;
        note(d, 'gain', `${lab} vencida ${e.src === 'kindle' ? '📖' : '💻'}${e.sec ? ` em ${Math.round(e.sec / 60)} min` : e.min ? ` em ${e.min} min` : ''}${wasPending ? ' (pendência quitada)' : ''} · +${C.xpStudy} XP`);
      } else if (e.t === 'review') {
        if (t.status !== 'done') continue;
        t.history.push(e); s.srcCount[e.src] = (s.srcCount[e.src] || 0) + 1;
        if (!t.reviews.some(r => r.day === d)) {
          const faded = D.diff(t.lastTouch, d) >= C.fadeStart;
          const p = faded ? C.ptsReviewFaded : C.ptsReview;
          s.points += p; s.xp += C.xpReview; t.level = Math.min(C.maxLevel, t.level + 1);
          note(d, 'gain', `Revisão de ${lab} ${e.src === 'kindle' ? '📖' : '💻'}${faded ? ' (resgatou do desbotamento)' : ''} · +${p}🪙 +${C.xpReview} XP`);
        }
        t.reviews.push(e); t.lastTouch = d;
        if (!available()) advanced = true;
      } else if (e.t === 'skip') {
        if (t.status !== 'locked' || s.points < C.skipCost) continue;
        s.points -= C.skipCost; Object.assign(t, { status: 'pending', skipDay: d, everSkipped: true }); t.history.push(e);
        note(d, 'loss', `Pulou ${lab} · −${C.skipCost}🪙`);
      }
    }
    for (const [w, list] of Object.entries(weekLessons)) {
      if (s.weeks[w] || !list.every(id => T[id]?.status === 'done')) continue;
      const perfect = list.every(id => !T[id].everSkipped);
      s.points += C.weekBonus; s.weeks[w] = { day: d, perfect };
      note(d, 'gain', `Pauta da semana de ${D.br(w)} transitada em julgado${perfect ? ' — acórdão unânime 🏛️' : ' 🔨'} · +${C.weekBonus}🪙`);
    }
    if (d === today) { s.todayAdvanced = advanced; break; }
    if (d < start) { if (advanced) { s.streak++; s.best = Math.max(s.best, s.streak); } continue; }
    // fechamento do dia
    for (const l of lessons) {
      const t = T[l.id];
      if (t?.status === 'pending' && t.skipDay < d) { s.points -= C.skipCost; note(d, 'loss', `Pendência ${lessonLabel(l)} drenou −${C.skipCost}🪙`); }
    }
    if (advanced) { s.streak++; s.best = Math.max(s.best, s.streak); s.idleRun = 0; }
    else if (!s.shields[D.monday(d)]) { s.shields[D.monday(d)] = d; note(d, 'shield', 'Dia sem avanço — habeas corpus semanal concedido 🛡️'); }
    else {
      if (s.streak) note(d, 'loss', `Sequência de ${s.streak} dia(s) perdida 🔥💨`);
      s.streak = 0; s.xp = Math.max(0, s.xp - C.idleXp); s.idleRun++;
      note(d, 'loss', `Dia sem avanço · −${C.idleXp} XP`);
    }
    if (s.points < 0) { s.xp = Math.max(0, s.xp - C.debtXp); note(d, 'loss', `Saldo negativo · −${C.debtXp} XP`); }
  }
  const tiles = lessons.map(l => {
    const t = T[l.id] || tile(l.id);
    const fade = t.status === 'done' ? clamp((D.diff(t.lastTouch, today) - C.fadeStart) / (C.fadeFull - C.fadeStart), 0, 1) : 0;
    return { ...l, ...t, fade, week: D.monday(l.date) };
  });
  const pending = tiles.filter(t => t.status === 'pending').length;
  let score = Math.min(s.idleRun, 3) + pending + (s.points < 0 ? 2 : 0);
  if (s.todayAdvanced) score = Math.max(0, score - 1);
  return {
    ...s, tiles, pending,
    pawn: tiles.findIndex(t => t.status === 'locked'),
    streakNow: s.streak + (s.todayAdvanced ? 1 : 0),
    level: Math.floor(s.xp / C.xpPerLevel) + 1,
    shieldAvailable: !s.shields[D.monday(today)],
    storm: score === 0 ? 0 : score <= 1 ? 1 : score <= 3 ? 2 : 3,
    fading: tiles.filter(t => t.fade > 0).length,
    conquered: Object.values(T).filter(t => t.status === 'done').length,
  };
}

const itemPath = rel => '/me/drive/root:/' + [...CLOUD.base.split('/'), ...(rel ? rel.split('/') : [])].map(encodeURIComponent).join('/') + ':';
async function graph(path, opts = {}) {

async function cloudChildren(rel) {

// ---------- progresso: arquivo _tabuleiro_progresso.json (pasta local ou OneDrive) ----------
async function readRemote() {
  try {
    if (IS_WEB) return account ? await (await graph(itemPath(PROGRESS_FILE) + '/content')).json() : null;
    if (!dirHandle) return null;
    return JSON.parse(await (await (await dirHandle.getFileHandle(PROGRESS_FILE)).getFile()).text());
  } catch (e) {
    if (e.status === 404 || e.name === 'NotFoundError') return null;
    throw e;
  }
}
async function writeRemote(text) {
  if (IS_WEB) return graph(itemPath(PROGRESS_FILE) + '/content', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: text });
  if ((await dirHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') return;
  const w = await (await dirHandle.getFileHandle(PROGRESS_FILE, { create: true })).createWritable();
  await w.write(text); await w.close();
}
function saveLocal() { try { localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); } catch (e) { /* sem storage */ } }
function loadLocal() { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; } }
let writeTimer = null;
function save() {
  DATA.savedAt = Date.now();

  if (SIM || !connected()) return;

// lê o arquivo antes de gravar e junta os eventos: PC, celular e tablet nunca apagam o que o outro registrou
async function writeProgressFile() {

    if (remote) { const n = DATA.events.length; DATA = mergeData(DATA, remote); if (DATA.events.length !== n) render(); }
    DATA.savedAt = Date.now(); saveLocal();

async function pullRemote() {
  if (SIM || !connected()) return;
  const remote = await readRemote().catch(() => null);
  if (!remote) return;
  const before = JSON.stringify([DATA.events.length, DATA.session]);
  DATA = mergeData(DATA, remote);
  if (JSON.stringify([DATA.events.length, DATA.session]) !== before) { saveLocal(); render(); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pullRemote(); });
function mergeData(a, b) {
  if (!b) return a;
  const map = new Map();
  for (const e of [...(a.events || []), ...(b.events || [])]) map.set(e.uid, e);
  const newer = (b.savedAt || 0) > (a.savedAt || 0) ? b : a;
  return {
    ...newer,
    startDay: [a.startDay, b.startDay].filter(Boolean).sort()[0],
    events: [...map.values()],
    lessons: newer.lessons?.length ? newer.lessons : (a.lessons?.length ? a.lessons : b.lessons || []),
    lastSeen: [a.lastSeen, b.lastSeen].filter(Boolean).sort().pop() || null,
  };
}

function idb() {
  return new Promise((res, rej) => { const r = indexedDB.open('tabuleiro10', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function idbGet(k) { try { const db = await idb(); return await new Promise(r => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch (e) { return null; } }

async function idbDel(k) { try { const db = await idb(); db.transaction('kv', 'readwrite').objectStore('kv').delete(k); } catch (e) { /* ok */ } }

async function listFromHandle(root) {
  const files = [], dirs = [];
  for await (const [n1, h1] of root.entries()) {
    if (h1.kind !== 'directory' || n1.startsWith('_') || n1.startsWith('.')) continue;
    for await (const [n2, h2] of h1.entries()) {
      if (h2.kind !== 'directory') continue;
      dirs.push(n1 + '/' + n2);
      if (!RE.lesson.test(n2.normalize('NFC'))) continue;
      for await (const [n3, h3] of h2.entries()) {
        if (h3.kind !== 'directory' || !RE.prod.test(n3.normalize('NFC'))) continue;
        for await (const [n4, h4] of h3.entries()) {
          if (h4.kind !== 'file' || !/\.html?$/i.test(n4)) continue;
          files.push({ rel: [n1, n2, n3, n4].join('/'), read: async () => (await h4.getFile()).slice(0, 16000).text() });
        }
      }
    }
  }
  return { files, dirs };
}
function listFromFileList(list) {
  const files = [], dirs = new Set();
  for (const f of list) {
    const seg = f.webkitRelativePath.split('/').slice(1);
    if (seg.length >= 3) dirs.add(seg[0] + '/' + seg[1]);
    if (seg.length === 4 && /\.html?$/i.test(seg[3])) files.push({ rel: seg.join('/'), read: () => f.slice(0, 16000).text() });
  }
  return { files, dirs: [...dirs] };
}
async function applyScan(listing, showReport) {
  const { lessons, report } = await buildLessons(listing.files, listing.dirs);
  const before = new Map((DATA.lessons || []).map(l => [l.id, l]));
  const after = new Set(lessons.map(l => l.id));
  report.added = lessons.filter(l => !before.has(l.id));
  report.removed = [...before.values()].filter(l => !after.has(l.id));
  report.total = lessons.length;
  report.at = new Date().toISOString();
  DATA.lessons = lessons; DATA.report = report;
  save(); render();
  if (showReport || report.added.length || report.removed.length) showReportModal(report, !showReport);
}

// ---------- tabuleiro SVG ----------
function buildNodes() {
  const nodes = [{ type: 'start' }];
  const weeks = [...new Set(S.tiles.map(t => t.week))].sort();
  const first = weeks[0];
  for (const w of weeks) {
    S.tiles.forEach((t, i) => { if (t.week === w) nodes.push({ type: 'tile', t, i }); });
    nodes.push({ type: 'chest', week: w, n: first ? D.diff(first, w) / 7 + 1 : 1 });
  }
  nodes.push({ type: 'end' });
  return nodes;
}
function renderBoard() {
  const svg = $('board');
  const W = Math.max(320, svg.parentElement.clientWidth);
  const cols = clamp(Math.floor(W / 150), 3, 8), cell = W / cols, rowH = Math.min(150, cell * 1.05), top = 20;
  const s = Math.min(cell * 0.66, 96);
  const nodes = buildNodes();
  nodes.forEach((n, i) => {
    const row = Math.floor(i / cols), c = i % cols, col = row % 2 ? cols - 1 - c : c;
    n.x = (col + 0.5) * cell; n.y = top + row * rowH + rowH / 2; n.row = row;
  });
  const H = top * 2 + Math.ceil(nodes.length / cols) * rowH + 10;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const pathD = upto => {
    let d = `M${nodes[0].x},${nodes[0].y}`;
    for (let i = 1; i <= upto && i < nodes.length; i++) {
      const a = nodes[i - 1], b = nodes[i];
      if (a.row === b.row) d += ` L${b.x},${b.y}`;
      else { const dir = a.x > W / 2 ? 1 : -1, off = cell * 0.55 * dir; d += ` C${a.x + off},${a.y} ${b.x + off},${b.y} ${b.x},${b.y}`; }
    }
    return d;
  };
  const pawnNode = S.pawn >= 0 ? nodes.findIndex(n => n.type === 'tile' && n.i === S.pawn) : nodes.length - 1;
  let out = `<defs>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="chestGlow"><stop offset="0" stop-color="#ffe58a"/><stop offset="1" stop-color="#ffe58a" stop-opacity="0"/></radialGradient>
  </defs>
  <path d="${pathD(nodes.length)}" fill="none" stroke="var(--path-edge)" stroke-width="${s * 0.42}" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${pathD(nodes.length)}" fill="none" stroke="var(--path)" stroke-width="${s * 0.34}" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${pathD(pawnNode)}" fill="none" stroke="var(--progress)" stroke-width="${s * 0.12}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 ${s * 0.2}" opacity=".9"/>`;
  for (const n of nodes) {
    if (n.type === 'start') out += `<g transform="translate(${n.x},${n.y})"><circle r="${s * 0.42}" fill="#fff" stroke="var(--path-edge)" stroke-width="4"/><text text-anchor="middle" y="${s * 0.12}" font-size="${s * 0.38}">🏛️</text><text class="lb" text-anchor="middle" y="${s * 0.62}" font-family="Fredoka,sans-serif" font-weight="700" font-size="13" fill="var(--ink)">Fórum</text></g>`;
    else if (n.type === 'end') out += `<g class="chest" transform="translate(${n.x},${n.y})"><circle r="${s * 0.42}" fill="#fff" stroke="var(--gold)" stroke-width="4"/><text y="${s * 0.12}" font-size="${s * 0.38}">🎓</text><text class="lb" y="${s * 0.62}" font-weight="700" font-size="13" fill="var(--ink)">Colação de grau</text></g>`;
    else if (n.type === 'chest') out += chestSVG(n, s);
    else out += tileSVG(n.t, n.x, n.y, s, n.i === S.pawn);
  }
  // peão
  out += `<g id="pawn"><g class="bob"><g transform="scale(${(s * 1.05 / 100).toFixed(3)})">${figureSVG(S.conquered)}</g></g></g>`;
  svg.innerHTML = out;
  const pos = i => { const n = nodes[i]; return `translate(${n.x}px, ${n.y + s * 0.24}px)`; };
  const pawn = $('pawn');
  const from = lastPawn === null ? pawnNode : (lastPawn >= 0 ? nodes.findIndex(n => n.type === 'tile' && n.i === lastPawn) : nodes.length - 1);
  lastPawn = null;
  if (from >= 0 && from < pawnNode) {
    pawn.style.transition = 'none'; pawn.style.transform = pos(from);
    let k = from;
    const step = () => { k++; while (k < pawnNode && nodes[k].type !== 'tile') k++; pawn.style.transition = ''; pawn.style.transform = pos(Math.min(k, pawnNode)); if (k < pawnNode) setTimeout(step, 340); };
    setTimeout(step, 80);
  } else { pawn.style.transition = 'none'; pawn.style.transform = pos(Math.max(0, pawnNode)); }
}
function tileSVG(t, x, y, s, isCur) {
  const color = discColor(t.discN), h = s / 2;
  const st = t.status === 'locked' ? (isCur ? 'current' : 'locked') : t.status;
  let filter = '', fill = color, extra = '';
  if (st === 'locked') fill = color;
  if (st === 'done') {
    const sat = 1 - 0.85 * t.fade, br = 1 - 0.2 * t.fade, glow = (2 + t.level * 4) * (1 - t.fade);
    filter = `saturate(${(sat * (1 + t.level * 0.12)).toFixed(2)}) brightness(${br.toFixed(2)}) drop-shadow(0 0 ${glow.toFixed(1)}px ${color})`;
  }
  if (st === 'pending') fill = '#3a0b10';
  const base = `<rect class="base" x="${-h}" y="${-h}" width="${s}" height="${s}" rx="16" fill="${fill}" ${st === 'locked' ? 'fill-opacity=".28"' : ''}/>`;
  if (st === 'locked') extra += `<rect x="${-h}" y="${-h}" width="${s}" height="${s * 0.16}" rx="8" fill="${color}" opacity=".8"/>`;
  if (st === 'current') extra += `<rect x="${-h}" y="${-h}" width="${s}" height="${s}" rx="16" fill="${color}" opacity=".55"/><rect class="ring" x="${-h - 5}" y="${-h - 5}" width="${s + 10}" height="${s + 10}" rx="20" fill="none" stroke="#fff"/>`;
  if (st === 'done') {
    extra += `<rect x="${-h}" y="${-h}" width="${s}" height="${s}" rx="16" fill="url(#hl)" opacity="${0.4 + t.level * 0.15}"/>`;
    if (t.level >= 3 && t.fade < 0.3) extra += `<rect class="shimmer" x="${-h}" y="${-h}" width="${s}" height="${s}" rx="16" fill="#fff"/>`;
    if (t.level >= CONFIG.maxLevel && t.fade < 0.3) extra += `<text x="0" y="${-h - 6}" font-size="${s * 0.26}">👑</text>`;
    const g = t.reviews.length, shown = Math.min(g, 8);
    for (let k = 0; k < shown; k++) {
      const gx = -h + (k + 0.5) * (s / 8);
      extra += `<circle class="gem" cx="${gx}" cy="${h - 2}" r="${s * 0.045}" fill="${t.reviews[k].src === 'kindle' ? '#7fd1ff' : '#ffd23f'}"/>`;
    }
    extra += `<text x="${h - 12}" y="${-h + 18}" font-size="${s * 0.17}">${t.src === 'kindle' ? '📖' : '💻'}</text>`;
    if (t.fade > 0) extra += `<text x="${-h + 12}" y="${-h + 18}" font-size="${s * 0.17}">🍂</text>`;
  }
  if (st === 'pending') {
    extra += `<path class="crack" d="M${-h + 8},${-h + 14} l${s * .18},${s * .14} l-${s * .06},${s * .16} l${s * .2},${s * .1}"/><path class="crack" d="M${h - 10},${-h + 10} l-${s * .15},${s * .2} l${s * .08},${s * .1}"/>
      <text x="0" y="${s * 0.04}" font-size="${s * 0.3}" class="num">☠️</text><text x="0" y="${h - 8}" font-size="${s * 0.13}" style="fill:#ffb3bd;font-weight:700">−${CONFIG.skipCost}🪙/dia</text>`;
  }
  if (st === 'current' && S.idleRun > 0) extra += `<path class="crack" d="M${-h + 6},${h - 10} l${s * .2},-${s * .1} l${s * .1},-${s * .18}"/><path class="crack" d="M${h - 8},${h - 6} l-${s * .12},-${s * .2}"/>`;
  const labels = st === 'pending'
    ? `<text class="sig" y="${-h + 16}" font-size="${s * 0.14}">${esc(lessonLabel(t))}</text>`
    : `<text class="num" y="${-s * 0.04}" font-size="${s * 0.26}">A${String(t.num).padStart(2, '0')}</text>
       <text class="sig" y="${s * 0.17}" font-size="${s * 0.15}">${esc(t.sigla)}</text>
       <text class="dt" y="${h - 10}" font-size="${s * 0.12}">${D.br(t.date)}</text>`;
  return `<g class="tile st-${st}" data-id="${esc(t.id)}" transform="translate(${x},${y})" style="${filter ? `filter:${filter}` : ''}">
    <title>${esc(lessonLabel(t))} · ${esc(t.title)}</title>${base}${extra}${labels}</g>`;
}
function chestSVG(n, s) {

// ---------- sessão (cronômetro) ----------
function startSession(id, kind, src) {
  const t = S.tiles.find(x => x.id === id);
  if (src === 'pc') openLesson(t);
  DATA.session = { id, kind, src, start: Date.now(), need: kind === 'study' ? CONFIG.studyMin : CONFIG.reviewMin };
  save(); renderPill(); tileModal(id);
}
function finishSession() {
  const s = DATA.session; if (!s) return;
  const el = Date.now() - s.start; if (el < s.need * 60e3) return;
  DATA.session = null; closeModal();
  addEvent({ t: s.kind, id: s.id, src: s.src, dev: isMobile() ? 'mobile' : 'pc', min: Math.round(el / 6e4), sec: Math.round(el / 1000) });
}
function renderPill() {
  const s = DATA.session, pill = $('pill');
  if (!s) { pill.classList.remove('on'); return; }
  const t = S.tiles.find(x => x.id === s.id);
  if (!t) { DATA.session = null; save(); pill.classList.remove('on'); return; }
  pill.classList.add('on');
  $('pillL').textContent = `${s.kind === 'study' ? 'Estudando' : 'Revisando'} ${lessonLabel(t)} ${s.src === 'kindle' ? '📖' : '💻'}`;
  tick();
}
function tick() {
  const s = DATA.session; if (!s) return;
  const left = s.need * 60e3 - (Date.now() - s.start);
  $('pillT').textContent = sessionClock(s);
  $('pillT').classList.toggle('over', left <= 0);
  $('pillBtn').textContent = left <= 0 ? (s.kind === 'study' ? '🏆 Concluir' : '✨ Concluir') : 'Abrir';
  if ($('mTimer')) {
    $('mTimer').textContent = sessionClock(s); $('mTimer').classList.toggle('over', left <= 0); $('mDone').disabled = left > 0;
    $('mTimerSub').textContent = left <= 0 ? 'Mínimo cumprido — agora o relógio conta todo o tempo na casa' : 'Contagem regressiva do tempo mínimo';
  }
}
setInterval(tick, 1000);
setInterval(() => { if (S && today() !== S._day) { render(); } }, 60e3);

// ---------- efeitos ----------
function toast(msg, bad) { const d = document.createElement('div'); d.className = 'toast' + (bad ? ' bad' : ''); d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2300); }
const conf = { parts: [], raf: 0 };
function burst(n) {
  const c = $('confetti'), ctx = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#ffd23f', '#e8504a', '#2f8fe0', '#22a865', '#9b59e0', '#fff'];
  for (let i = 0; i < n; i++) conf.parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight / 3, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 3, c: cols[i % cols.length], a: Math.random() * 6, life: 120 + Math.random() * 60 });
  if (conf.raf) return;
  const loop = () => {
    ctx.clearRect(0, 0, c.width, c.height);
    conf.parts = conf.parts.filter(p => p.life-- > 0);
    for (const p of conf.parts) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); }
    conf.raf = conf.parts.length ? requestAnimationFrame(loop) : 0;
  };
  conf.raf = requestAnimationFrame(loop);
}
const rain = { drops: [], raf: 0, level: 0, nextFlash: 0 };
function weather() {
  rain.level = S.storm;
  const c = $('rain');
  if (rain.level < 2) { cancelAnimationFrame(rain.raf); rain.raf = 0; c.getContext('2d').clearRect(0, 0, c.width, c.height); return; }
  if (rain.raf) return;
  const ctx = c.getContext('2d');
  const loop = t => {
    if (c.width !== innerWidth) { c.width = innerWidth; c.height = innerHeight; }
    const want = rain.level === 3 ? 260 : 120;
    while (rain.drops.length < want) rain.drops.push({ x: Math.random() * c.width, y: Math.random() * c.height, l: 10 + Math.random() * 14, v: 9 + Math.random() * 8 });
    ctx.clearRect(0, 0, c.width, c.height); ctx.strokeStyle = 'rgba(200,215,235,.45)'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (const d of rain.drops) { d.y += d.v; d.x -= d.v * .25; if (d.y > c.height) { d.y = -20; d.x = Math.random() * c.width * 1.2; } ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.l * .25, d.y - d.l); }
    ctx.stroke();
    if (t > rain.nextFlash) {
      if (rain.nextFlash) { const f = $('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
      rain.nextFlash = t + (rain.level === 3 ? 4000 + Math.random() * 5000 : 12000 + Math.random() * 9000);
    }
    rain.raf = requestAnimationFrame(loop);
  };
  rain.raf = requestAnimationFrame(loop);
}

// ---------- cliques ----------
document.addEventListener('click', e => {
  const open = e.target.closest('[data-open]');
  if (open) { e.preventDefault(); tileModal(open.dataset.open); return; }
  const tileEl = e.target.closest('.tile'); if (tileEl) return tileModal(tileEl.dataset.id);
  const chestEl = e.target.closest('.chest[data-week]'); if (chestEl) return weekModal(chestEl.dataset.week);
  if (e.target.id === 'modal') return closeModal();
  if (e.target.id === 'btnConnect') return IS_WEB ? cloudLogin() : connectFolder();
  const a = e.target.closest('[data-act]'); if (!a) return;
  const id = $('modalCard').dataset.id;
  switch (a.dataset.act) {
    case 'close': closeModal(); break;
    case 'back': tileModal(id); break;
    case 'start': startSession(id, a.dataset.kind, a.dataset.src); break;
    case 'read': openLesson(S.tiles.find(x => x.id === id)); break;
    case 'logout': closeModal(); MSAL?.logoutRedirect({ account }); break;
    case 'later': laterModal(id, a.dataset.kind); break;
    case 'saveLater': {
      const entry = { t: a.dataset.kind, id, src: 'kindle', manual: true, day: $('kDay').value, min: +$('kMin').value, note: $('kNote').value.trim() };
      closeModal();
      addEvent(entry);
      break;
    }
    case 'finish': finishSession(); break;
    case 'cancel': DATA.session = null; save(); renderPill(); tileModal(id); break;
    case 'skip': skipModal(id); break;
    case 'confirmSkip': closeModal(); addEvent({ t: 'skip', id }); break;
    case 'rules': rulesModal(); break;
    case 'wardrobe': wardrobeModal(); break;
    case 'journal': journalModal(); break;
    case 'export': exportData(); break;
    case 'import': $('importInput').click(); break;
    case 'connect': closeModal(); IS_WEB ? cloudLogin() : connectFolder(); break;
    case 'disconnect': dirHandle = null; idbDel('dir'); closeModal(); render(); break;
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('reader').classList.remove('on'); } });
$('readerX').onclick = () => { $('reader').classList.remove('on'); $('readerF').srcdoc = ''; };
$('dirInput').onchange = async e => { if (e.target.files.length) await applyScan(listFromFileList(e.target.files), true); e.target.value = ''; };
$('importInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!Array.isArray(d.events)) throw new Error('arquivo sem eventos'); DATA = mergeData(DATA, d); save(); render(); toast('Backup importado'); }
  catch (err) { toast('Backup inválido: ' + err.message, true); }
  e.target.value = '';
};
function exportData() {
  const blob = new Blob([JSON.stringify(DATA, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tabuleiro-backup-${today()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => S && renderBoard(), 150); });

// ---------- início ----------
(async function init() {
  if (!DATA.startDay) DATA.startDay = today();
  render();
  if (IS_WEB) {
    try { await cloudInit(); } catch (e) { toast('Falha no login: ' + e.message, true); }
    if (account) { try { await syncFromRemote(false); } catch (e) { toast('Falha ao ler o OneDrive: ' + e.message, true); } }
    render();
  }
  const h = IS_WEB ? null : await idbGet('dir');
  if (h) {
    dirHandle = h;
    try { if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted') await syncFromRemote(false); else dirHandle = null, window._pendingHandle = h; }
    catch (e) { dirHandle = null; }
    render();
  }
  if (!connected() && !DATA.lessons?.length && !window._pendingHandle) {
    openModal(`<div class="head" style="background:linear-gradient(135deg,#7c5cff,#2f8fe0)"><div class="meta">Bem-vindo(a)!</div><h2>⚖️ Tabuleiro de Estudos</h2></div>
      <div class="body"><p>Cada aula fichada vira uma casa no caminho do Fórum. A cada casa vencida seu personagem ganha uma peça do traje — da camiseta de calouro à toga completa. Avance todo dia, revise para fazer as casas brilharem e fuja da tempestade.</p>
      <p>${IS_WEB ? 'Para começar, entre com sua conta Microsoft: o jogo lê as aulas e o progresso direto do seu OneDrive — o mesmo do PC.' : 'Para começar, selecione a pasta <b>10º</b> (a mesma onde este arquivo está). O jogo vai ler as aulas e salvar seu progresso lá.'}</p>
      <div class="row"><button class="primary" data-act="connect">${IS_WEB ? '🔑 Entrar com a conta Microsoft' : '📂 Selecionar pasta 10º'}</button><button class="ghost" data-act="rules">Como jogar</button></div></div>`);
  } else if (DATA.lastSeen && DATA.lastSeen < today()) {
    const days = Object.keys(S.journal).filter(d => d >= DATA.lastSeen && d < today()).sort();
    awayModal(days);
  }
  DATA.lastSeen = today(); save();
})();
// reconectar com um clique quando a permissão expirou
document.addEventListener('click', async e => {
  if (e.target.id !== 'btnConnect' || !window._pendingHandle) return;
  e.stopImmediatePropagation();
  const h = window._pendingHandle;
  if ((await h.requestPermission({ mode: 'readwrite' })) === 'granted') { dirHandle = h; window._pendingHandle = null; await syncFromRemote(false); }
}, true);
</script>
</body>
</html>
